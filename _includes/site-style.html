  <style>
:root {
  --bg-1: #f7f3ec;
  --bg-2: #f5f1e8;
  --bg-3: #eee8dd;
  --panel: rgba(255, 255, 255, 0.72);
  --panel-strong: rgba(255, 255, 255, 0.86);
  --panel-soft: rgba(255, 252, 247, 0.94);
  --stroke: rgba(31, 41, 64, 0.10);
  --stroke-strong: rgba(31, 41, 64, 0.14);
  --text: #1f2940;
  --muted: #5b6475;
  --muted-soft: #7d8594;
  --accent: #4c5e8a;
  --accent-2: #24324a;
  --accent-3: #c6a46a;
  --shadow-deep: 0 18px 48px rgba(30, 40, 60, 0.10);
  --shadow-soft: 0 8px 24px rgba(30, 40, 60, 0.08);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --max-width: 1200px;
  --header-height: 86px;
  --font-sans: "Aptos", "Segoe UI", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.72;
  background:
    radial-gradient(circle at 14% 10%, rgba(198, 164, 106, 0.10), transparent 0 24%),
    radial-gradient(circle at 86% 8%, rgba(76, 94, 138, 0.08), transparent 0 22%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0) 28%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 38%, var(--bg-3) 100%);
  overflow-x: hidden;
}

main[id],
.section-panel[id],
.page-heading[id] {
  scroll-margin-top: calc(var(--header-height) + 16px);
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
}

button,
input,
textarea,
select {
  font: inherit;
}

.container {
  width: min(calc(100% - 32px), var(--max-width));
  margin: 0 auto;
}

.page-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.42;
  pointer-events: none;
  z-index: -1;
}

.orb-left {
  width: 420px;
  height: 420px;
  left: -110px;
  top: 12vh;
  background: radial-gradient(circle, rgba(198, 164, 106, 0.20), rgba(198, 164, 106, 0.06) 54%, transparent 74%);
}

.orb-right {
  width: 500px;
  height: 500px;
  right: -150px;
  top: 4vh;
  background: radial-gradient(circle, rgba(76, 94, 138, 0.16), rgba(76, 94, 138, 0.05) 56%, transparent 76%);
}

.glass-panel,
.glass-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--stroke-strong);
}

.glass-panel {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 253, 248, 0.74) 58%, rgba(249, 245, 238, 0.78)),
    var(--panel);
  box-shadow:
    var(--shadow-deep),
    inset 0 1px 0 rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
}

.glass-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(140deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.12) 20%, transparent 52%),
    radial-gradient(circle at 84% 12%, rgba(198, 164, 106, 0.10), transparent 22%);
  opacity: 0.7;
}

.glass-card {
  background: var(--panel-soft);
  box-shadow: var(--shadow-soft);
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 12px 0 0;
}

.header-shell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: var(--header-height);
  border-radius: 24px;
  padding: 12px 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: #fff;
  background: linear-gradient(145deg, rgba(170, 184, 255, 0.95), rgba(95, 109, 230, 0.95));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.45),
    inset 0 -6px 12px rgba(58, 68, 160, 0.35),
    0 10px 26px rgba(79, 97, 216, 0.36);
  position: relative;
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.45);
  opacity: 0.6;
}

.brand-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.brand-copy strong {
  font-size: 0.98rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.brand-copy span {
  font-size: 0.82rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.desktop-nav,
.header-tools,
.lang-switch,
.mobile-nav,
.hero-actions,
.signal-item,
.entry-item,
.contact-list li {
  position: relative;
  z-index: 1;
}

.desktop-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.nav-link {
  padding: 10px 13px;
  border-radius: 999px;
  color: var(--muted);
  transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.nav-link:hover,
.nav-link:focus-visible {
  background: rgba(76, 94, 138, 0.08);
  color: var(--accent-2);
  transform: translateY(-1px);
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

.lang-switch {
  display: inline-flex;
  padding: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.62);
  border: 1px solid rgba(31, 41, 64, 0.08);
}

.lang-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.lang-btn.active {
  background: var(--accent);
  color: #fff;
}

.menu-toggle {
  display: none;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  border: 1px solid rgba(31, 41, 64, 0.10);
  background: rgba(255, 255, 255, 0.56);
  color: var(--text);
  cursor: pointer;
  padding: 0;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
}

.menu-toggle span {
  width: 18px;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.menu-toggle[aria-expanded="true"] span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.menu-toggle[aria-expanded="true"] span:nth-child(2) {
  opacity: 0;
}

.menu-toggle[aria-expanded="true"] span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

.mobile-panel {
  margin-top: 12px;
  border-radius: 24px;
}

.mobile-panel-inner {
  padding: 18px;
}

.mobile-lang {
  margin-bottom: 14px;
}

.mobile-nav {
  display: grid;
  gap: 10px;
}

.mobile-nav a {
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.62);
  color: var(--text);
}

.hero {
  padding: 24px 0 20px;
}

.hero-shell {
  display: grid;
  gap: 30px;
  border-radius: var(--radius-xl);
  padding: clamp(34px, 5vw, 54px);
}

.hero-main,
.hero-overview {
  position: relative;
  z-index: 1;
}

.side-label,
.card-meta,
.post-meta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid rgba(76, 94, 138, 0.12);
  background: rgba(255, 255, 255, 0.72);
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.hero-main h1,
.page-heading h1 {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(2.5rem, 5vw, 4.8rem);
  line-height: 1.02;
  letter-spacing: -0.03em;
}

.hero-main h1 {
  margin: 0 0 14px;
  max-width: 12ch;
}

.page-heading h1 {
  margin: 18px 0 14px;
}

.tagline {
  margin: 0;
  max-width: 46rem;
  min-height: 3.8rem;
  color: var(--muted);
  font-size: clamp(1.02rem, 1.35vw, 1.14rem);
  line-height: 1.85;
}

.typing-target {
  display: inline;
}

.cursor {
  display: inline-block;
  width: 0.38ch;
  color: rgba(76, 94, 138, 0.56);
  animation: cursor-blink 1s steps(1) infinite;
}

.cursor::after {
  content: "|";
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 30px;
}

.btn,
.text-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
}

.btn {
  min-height: 50px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 600;
}

.btn:hover,
.btn:focus-visible,
.text-link:hover,
.text-link:focus-visible {
  transform: translateY(-1px);
}

.btn-primary {
  color: #fff;
  background: var(--accent);
  box-shadow: 0 8px 20px rgba(76, 94, 138, 0.16);
}

.btn-secondary {
  color: var(--text);
  border-color: rgba(31, 41, 64, 0.10);
  background: rgba(255, 255, 255, 0.74);
}

.hero-overview,
.list-shell,
.post-shell {
  border-radius: var(--radius-lg);
}

.hero-overview {
  padding: 28px 28px 26px;
  background: rgba(255, 251, 246, 0.76);
  border: 1px solid rgba(31, 41, 64, 0.08);
  box-shadow: 0 8px 24px rgba(30, 40, 60, 0.05);
}

.hero-overview-copy {
  max-width: 900px;
}

.hero-overview h2 {
  margin: 16px 0 12px;
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(1.45rem, 2.2vw, 2rem);
  line-height: 1.18;
}

.hero-overview p {
  margin: 0;
  color: var(--muted);
}

.signal-list {
  display: grid;
  gap: 14px;
  margin-top: 24px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.signal-item {
  display: grid;
  gap: 6px;
  padding: 18px 18px 16px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(31, 41, 64, 0.08);
  box-shadow: 0 6px 18px rgba(30, 40, 60, 0.04);
}

.signal-item strong {
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 600;
}

.signal-item span {
  color: var(--muted-soft);
  font-size: 0.94rem;
  line-height: 1.72;
}

.page-section {
  padding: 18px 0;
}

.page-main {
  padding-bottom: 24px;
}

.page-hero {
  padding: 30px 0 10px;
}

.section-panel {
  display: grid;
  gap: 24px;
}

.page-section .section-panel {
  padding: clamp(24px, 2.8vw, 30px);
  border-radius: var(--radius-xl);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 252, 247, 0.40)),
    rgba(255, 250, 244, 0.38);
  border: 1px solid rgba(31, 41, 64, 0.08);
  box-shadow: 0 8px 24px rgba(30, 40, 60, 0.05);
}

.page-heading {
  padding: 28px;
  border-radius: var(--radius-xl);
}

.section-heading {
  display: grid;
  gap: 12px;
  max-width: 840px;
}

.section-heading.with-action {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  max-width: none;
}

.section-heading h2,
.post-shell h2,
.post-shell h3 {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: clamp(1.55rem, 2.5vw, 2.4rem);
  line-height: 1.18;
  letter-spacing: -0.03em;
}

.section-heading p,
.page-heading p {
  margin: 0;
  color: var(--muted);
  max-width: 64ch;
}

.card-grid,
.split-grid {
  display: grid;
  gap: 18px;
}

.card-grid-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.card-grid-1 {
  grid-template-columns: 1fr;
}

.card-grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.split-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.card,
.list-shell {
  padding: 28px;
}

.card {
  border-radius: var(--radius-lg);
}

.card h2,
.card h3,
.list-shell h3,
.entry-item h4 {
  margin: 16px 0 12px;
  font-family: var(--font-sans);
  font-size: 1.28rem;
  font-weight: 600;
  line-height: 1.28;
}

.card p,
.entry-item p {
  margin: 0;
  color: var(--muted);
  line-height: 1.78;
}

.note-card,
.member-card {
  display: flex;
  flex-direction: column;
}

.member-affiliation,
.entry-place {
  color: var(--accent);
  font-size: 0.94rem;
  margin-bottom: 12px;
}

.text-link {
  align-self: flex-start;
  margin-top: 18px;
  color: var(--accent);
  font-weight: 600;
}

.entry-list {
  display: grid;
  gap: 16px;
  margin-top: 16px;
}

.entry-item {
  padding: 20px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(31, 41, 64, 0.08);
}

.entry-date {
  font-size: 0.86rem;
  color: var(--muted-soft);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.contact-list {
  list-style: none;
  padding: 0;
  margin: 18px 0 0;
  display: grid;
  gap: 14px;
}

.contact-list li {
  display: grid;
  gap: 6px;
  padding: 16px 18px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(31, 41, 64, 0.08);
}

.contact-label {
  color: var(--muted-soft);
  font-size: 0.86rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.site-footer {
  padding: 22px 0 34px;
}

.footer-shell {
  border-radius: 24px;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.footer-block {
  display: grid;
  gap: 6px;
}

.footer-block strong {
  font-family: var(--font-serif);
  font-size: 1.04rem;
  font-weight: 600;
}

.footer-block span,
.footer-note {
  color: var(--muted);
  font-size: 0.92rem;
}

.back-link {
  margin-bottom: 14px;
}

.post-summary {
  margin: 12px 0 0;
  max-width: 760px;
  color: var(--muted);
}

.post-shell {
  padding: 34px;
}

.post-body {
  position: relative;
  z-index: 1;
}

.post-body > :first-child {
  margin-top: 0;
}

.post-body > :last-child {
  margin-bottom: 0;
}

.post-body h2,
.post-body h3,
.post-body h4 {
  margin: 1.8em 0 0.6em;
  font-family: var(--font-serif);
  font-weight: 600;
  line-height: 1.2;
}

.post-body p,
.post-body ul,
.post-body ol,
.post-body blockquote {
  margin: 0 0 1em;
}

.post-body ul,
.post-body ol {
  padding-left: 1.4rem;
}

.post-body code {
  padding: 0.12rem 0.4rem;
  border-radius: 8px;
  background: rgba(76, 94, 138, 0.08);
  font-family: "Consolas", "SFMono-Regular", ui-monospace, monospace;
}

.post-body pre {
  overflow: auto;
  padding: 16px;
  border-radius: 18px;
  background: rgba(31, 41, 64, 0.92);
  border: 1px solid rgba(31, 41, 64, 0.08);
}

.post-body pre code {
  padding: 0;
  background: transparent;
}

.post-body blockquote {
  padding: 16px 18px;
  border-left: 3px solid rgba(198, 164, 106, 0.7);
  border-radius: 0 16px 16px 0;
  background: rgba(255, 255, 255, 0.56);
  color: var(--muted);
}

.post-body a {
  color: var(--accent);
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid rgba(76, 94, 138, 0.46);
  outline-offset: 3px;
}

@keyframes cursor-blink {
  0%,
  49% {
    opacity: 1;
  }

  50%,
  100% {
    opacity: 0;
  }
}

@media (max-width: 1080px) {
  .desktop-nav {
    display: none;
  }

  .menu-toggle {
    display: inline-flex;
  }

  .card-grid-3,
  .split-grid {
    grid-template-columns: 1fr;
  }

  .card-grid-2 {
    grid-template-columns: 1fr;
  }

  .signal-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .section-heading.with-action,
  .footer-shell {
    align-items: start;
    flex-direction: column;
  }
}

@media (max-width: 720px) {
  :root {
    --header-height: 74px;
  }

  .container {
    width: min(calc(100% - 20px), var(--max-width));
  }

  .site-header {
    padding-top: 10px;
  }

  .header-shell {
    min-height: 74px;
    padding: 10px 12px;
  }

  .brand-copy span {
    display: none;
  }

  .hero {
    padding-top: 20px;
  }

  .hero-shell,
  .hero-overview,
  .page-heading,
  .post-shell,
  .card,
  .list-shell {
    padding: 20px;
  }

  .hero-main h1,
  .page-heading h1 {
    font-size: clamp(2.1rem, 10vw, 3.2rem);
  }

  .hero-actions {
    flex-direction: column;
  }

  .btn {
    width: 100%;
  }

  .tagline {
    min-height: 4.6rem;
  }

  .signal-list {
    grid-template-columns: 1fr;
  }
}

/* Minimal Editorial Override */
:root {
  --minimal-bg: #ffffff;
  --minimal-text: #1a1a1a;
  --minimal-muted: #666666;
  --minimal-line: #eeeeee;
  --minimal-shadow-soft: 0 14px 34px rgba(18, 18, 18, 0.075);
  --minimal-shadow-medium: 0 26px 70px -46px rgba(18, 18, 18, 0.34);
  --minimal-shadow-block: 0 18px 46px -34px rgba(18, 18, 18, 0.24);
  --minimal-shadow-rule: 0 18px 34px -30px rgba(18, 18, 18, 0.32);
  --minimal-shadow-button: 0 10px 26px rgba(18, 18, 18, 0.09);
  --minimal-shadow-button-hover: 0 16px 34px rgba(18, 18, 18, 0.14);
}

body {
  background: var(--minimal-bg) !important;
  color: var(--minimal-text) !important;
  font-family: "Inter", "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif !important;
}

.container {
  width: min(calc(100% - clamp(52px, 6vw, 88px)), var(--max-width)) !important;
}

.hero-main,
.hero-overview,
.page-section,
.section-heading,
.signal-item,
.card,
.list-shell,
.entry-item,
.contact-list li {
  position: relative !important;
}

.page-orb {
  display: none !important;
}

.glass-panel,
.glass-card,
.hero-overview,
.section-panel,
.card,
.list-shell,
.entry-item,
.contact-list li,
.footer-shell,
.page-heading,
.post-shell {
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

.glass-panel::before,
.glass-panel::after,
.glass-card::before,
.glass-card::after {
  display: none !important;
}

.site-header {
  padding: 0 !important;
  background: rgba(255, 255, 255, 0.92) !important;
  border-bottom: 1px solid var(--minimal-line) !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.78),
    var(--minimal-shadow-soft),
    0 2px 10px rgba(18, 18, 18, 0.035) !important;
}

.header-shell {
  min-height: 80px !important;
  padding: 0 !important;
}

.brand {
  gap: 0 !important;
}

.brand-mark {
  display: none !important;
}

.brand-mark::before {
  content: "AI";
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.brand-copy strong {
  font-size: 1.18rem !important;
  font-weight: 700 !important;
  letter-spacing: -0.02em !important;
}

.brand-copy span {
  display: none !important;
