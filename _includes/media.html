{%- assign media = site.data.media[include.key] -%}
{%- if media -%}
<figure class="editorial-figure">
  <a href="{{ media.source_url }}" target="_blank" rel="noopener"><img src="{{ media.src | relative_url }}" alt="{{ media.alt | escape }}" width="{{ media.width }}" height="{{ media.height }}" loading="lazy" decoding="async"></a>
  <figcaption>{{ media.caption }} <span class="editorial-credit">{{ media.credit }} <a href="{{ media.source_url }}" target="_blank" rel="noopener">原資料 ↗</a></span></figcaption>
</figure>
{%- endif -%}
