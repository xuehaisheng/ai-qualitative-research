{%- comment %} Links names of people in the body to their card on the AI literacy page. kind: notes (research notes) or terms (term pages). {% endcomment -%}
<script type="application/json" id="people-index" data-key="{{ page.key }}" data-kind="{{ include.kind }}" data-base="{{ '/literacy/' | relative_url }}">[{% for p in site.data.people %}{"id":{{ p.id | jsonify }},"ja":{{ p.name | jsonify }},"en":{{ p.name_en | jsonify }},"notes":{{ p.notes | jsonify }},"terms":{{ p.terms | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
<script defer src="{{ '/assets/js/people-links.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}"></script>
