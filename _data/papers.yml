- id: atmawijaya2026
  stance: "optimistic"
  cite: "Atmawijaya (2026)"
  year: 2026
  title: "Between code and context: Empowering qualitative researchers to leverage AI with rigor and responsibility [Review of the book AI for qualitative research: A hands-on guide for management scholars, by D. Garcia Quevedo & J. Kuri]"
  title_ja: "コードと文脈のあいだ：AIを厳密かつ責任をもって使えるよう質的研究者を後押しする（書評）"
  apa: "Atmawijaya, T. D. (2026). Between code and context: Empowering qualitative researchers to leverage AI with rigor and responsibility [Review of the book AI for qualitative research: A hands-on guide for management scholars, by D. Garcia Quevedo & J. Kuri]. The Qualitative Report, 31(5), 5920–5929."
  doi: "https://doi.org/10.46743/1052-0147.8934"
  summary: "経営学の研究者向けに、LLMを質的分析に使うための入門書（Garcia Quevedo & Kuri, 2026）を紹介する書評。本は理論の基礎と実践の二部構成で、概念の理解だけでなく、分析の流れにAIを組み込むためのプログラミングの技能まで身につけることをめざしている。責任ある使い方にも配慮している。評者はこの本を「時宜を得た、読みやすい本」と評価し、解釈の深みを保ちながら大量のテキストに取り組むやり方を変えうると述べる。目立った批判は述べていない。"
  summary_en: "A book review of an introduction to using LLMs for qualitative analysis, written for management researchers (Garcia Quevedo & Kuri, 2026). The book has two parts, theoretical foundations and practice, and aims to teach not only the concepts but also the programming skills needed to build AI into an analysis workflow. It also attends to responsible use. The reviewer calls it a timely and readable book that could change how researchers work with large volumes of text while keeping interpretive depth, and raises no notable criticisms."
  themes: ["実践の手引き", "分析・コーディング"]
- id: autenrieth2026
  stance: "optimistic"
  cite: "Autenrieth et al. (2026)"
  year: 2026
  title: "From metrics to meaning: Large language models and the computational turn in embodied educational research"
  title_ja: "指標から意味へ：大規模言語モデルと、身体化された教育研究の計算論的転回"
  apa: "Autenrieth, D., Autenrieth, N., & Farsani, D. (2026). From metrics to meaning: Large language models and the computational turn in embodied educational research. Frontiers in Language Sciences, 5, Article 1753250."
  doi: "https://doi.org/10.3389/flang.2026.1753250"
  summary: "教育研究では、量的指標は大勢を扱えるが細かな違いを見落とし、質的探究は深いが大勢には広げにくい。混合研究法も、時間と人手が足りずに統合が浅くなりがちだった。著者らは、学びや言葉は身体・感情・社会的な経験に根ざすという身体化認知の立場から「計算論的解釈学」を提案する。具体的には、意味の類似度による評定（SSR）、AIによる質的内容分析（AI-QCA）、マルチモーダルな映像分析による計算論的エスノグラフィーの三つの方法を示し、学生の振り返り、メタファー、教室のハビトゥスを大規模に分析できるとする。一方で、幻覚、偏り、出力の揺れ、プライバシーのリスクを認め、解釈と検証は人間が担うべきだとしている。"
  summary_en: "In educational research, quantitative indicators can cover many people but miss fine differences, while qualitative inquiry goes deep but is hard to scale. Mixed methods have often ended up with shallow integration for lack of time and staff. From an embodied-cognition position, which holds that learning and language are rooted in bodily, emotional and social experience, the authors propose a 'computational hermeneutics'. They present three methods: semantic similarity rating (SSR), AI-assisted qualitative content analysis (AI-QCA), and computational ethnography using multimodal video analysis, and argue these allow large-scale analysis of student reflections, metaphors and classroom habitus. They acknowledge risks of hallucination, bias, output variability and privacy, and hold that interpretation and verification must stay with humans."
  themes: ["分析・コーディング", "解釈・反省性"]
- id: baez2026
  stance: "cautious"
  cite: "Báez et al. (2026)"
  year: 2026
  title: "Addressing the special issue: Intersections (existing, emerging, and imagined) between artificial intelligence and qualitative health research"
  title_ja: "特集号に寄せて：人工知能と質的健康研究の交わり（すでにあるもの、生まれつつあるもの、想像されるもの）"
  apa: "Báez, J. C., Salvo, J., & Lester, J. N. (2026). Addressing the special issue: Intersections (existing, emerging, and imagined) between artificial intelligence and qualitative health research. Qualitative Health Research, 36(2–3), 140–144."
  doi: "https://doi.org/10.1177/10497323261417532a"
  summary: "『Qualitative Health Research』誌のAI特集号の序文。AIを「採用するか、拒否するか」の二択で扱わず、認識論・方法論・倫理についての問いを立てる、批判的な探究の対象として位置づける。特集には、AIに期待する立場から強く警戒する立場まで、ふだんは対立しがちな論文が並んでいる。編者らはこれを、多様な立場を一つの「大きなテント」に集めたものだと説明している。"
  summary_en: "The introduction to the AI special issue of Qualitative Health Research. Rather than treating AI as a choice between adoption and rejection, it frames AI as an object of critical inquiry that raises epistemological, methodological and ethical questions. The issue brings together papers that usually stand opposed, from hopeful to strongly wary positions; the editors describe it as gathering diverse stances under one 'big tent'."
  themes: ["倫理・公正", "解釈・反省性"]
- id: bergman2024
  stance: "support"
  cite: "Bergman et al. (2024)"
  year: 2024
  title: "“Where no one has gone before”: Questions to ensure the ethical, rigorous, and thoughtful application of artificial intelligence in the analysis of HIV research"
  title_ja: "「誰も行ったことのない場所へ」：HIV研究の分析で人工知能を倫理的に、厳密に、思慮深く使うための問い"
  apa: "Bergman, A. J., McNabb, K. C., Relf, M. V., & Dredze, M. H. (2024). “Where no one has gone before”: Questions to ensure the ethical, rigorous, and thoughtful application of artificial intelligence in the analysis of HIV research. Journal of the Association of Nurses in AIDS Care, 35(5), 450–455."
  doi: "https://doi.org/10.1097/jnc.0000000000000483"
  summary: "ChatGPTの登場後、ATLAS.tiなどの質的分析ソフトにもAIによるコーディング機能が入った。この論考は、HIV研究の質的分析でAIコーディングを使うことの利点と問題を検討する。著者らはまず、HIVとともに生きる人の経験を理解するうえで質的研究が欠かせないこと、そして研究がどの立場に立つかは研究者の認識論で決まることを確認する。そのうえで、研究課題、認識論、研究の目的に照らして、AIをどこまで使ってよいかを判断するための問いを示す。結論は、AIコーディングは一律に良いとも悪いとも言えず、研究の目的と認識論に合っているかどうかで決まる、というものである。"
  summary_en: "After ChatGPT appeared, qualitative analysis software such as ATLAS.ti added AI coding features. This essay examines the benefits and problems of AI coding in qualitative HIV research. The authors first affirm that qualitative research is essential for understanding the experiences of people living with HIV, and that the position a study takes depends on the researcher's epistemology. They then offer questions for deciding how far AI may be used, in light of the research question, epistemology and aims. Their conclusion: AI coding is neither good nor bad in itself; it depends on whether it fits the study's purpose and epistemology."
  themes: ["倫理・公正", "分析・コーディング"]
- id: christou2026
  stance: "support"
  cite: "Christou (2026)"
  year: 2026
  title: "Reconfiguring reflexivity in the era of AI: From “turning back” to “looking forward” through constructivist and posthumanist lenses"
  title_ja: "AI時代の反省性を組み替える：構成主義とポストヒューマニズムから見た「ふり返る」から「先を見る」への転換"
  apa: "Christou, P. A. (2026). Reconfiguring reflexivity in the era of AI: From “turning back” to “looking forward” through constructivist and posthumanist lenses. Qualitative Inquiry."
  doi: "https://doi.org/10.1177/10778004261445052"
  summary: "反省性（リフレクシビティ）とは、研究者の前提や選択が研究にどう影響しているかを批判的に点検することである。著者は、AIが研究のほぼすべての段階に入り込んだいま、この概念を考え直す必要があると論じる。構成主義の立場から見ると、AIは立ち位置や認識論についての反省性を損ないうるし、人間の研究者だけが反省の主体だという前提も揺らぐ。一方、ポストヒューマニズムの立場から見ると、反省が個人の外に広がる「分散した反省性」によって、AIが反省性を強める可能性もある。著者は、人間だけに頼る構成主義を批判しつつ、ポストヒューマン的な熱狂がAIの無批判な受け入れにつながる危険にも注意を促す。"
  summary_en: "Reflexivity means critically examining how researchers' assumptions and choices shape their research. The author argues that this concept needs rethinking now that AI has entered nearly every stage of research. From a constructivist view, AI can undermine positional and epistemological reflexivity and unsettle the assumption that only human researchers reflect. From a posthumanist view, AI may strengthen reflexivity through a 'distributed reflexivity' that extends beyond the individual. The author criticizes a constructivism that relies on humans alone, while warning that posthuman enthusiasm can slide into uncritical acceptance of AI."
  themes: ["解釈・反省性"]
- id: dahal2024
  stance: "cautious"
  cite: "Dahal (2024)"
  year: 2024
  title: "How can generative AI (GenAI) enhance or hinder qualitative studies? A critical appraisal from South Asia, Nepal"
  title_ja: "生成AIは質的研究を助けるのか、妨げるのか：南アジア・ネパールからの批判的検討"
  apa: "Dahal, N. (2024). How can generative AI (GenAI) enhance or hinder qualitative studies? A critical appraisal from South Asia, Nepal. The Qualitative Report, 29(3), 722–733."
  doi: "https://doi.org/10.46743/2160-3715/2024.6637"
  summary: "ネパールのカトマンズ大学の研究者が、南アジアの立場から書いたコメンタリー。ChatGPT、Bard（現Gemini）、Bing Chat（現Copilot）などの生成AIが質的研究でどう使われているかを整理し、長所、限界、倫理的なジレンマを検討する。AIは共著者、対話の場、研究助手として研究を助けうるが、信頼できない結果、偏り、非倫理的な成果を生む危険もあるとする。あわせて、AIの使用を論文の中でどう明示するかについての指針を示し、このコメンタリー自体を書く際にAIをどう使ったかも振り返っている。"
  summary_en: "A commentary from a South Asian perspective by a researcher at Kathmandu University, Nepal. It reviews how generative AI such as ChatGPT, Bard (now Gemini) and Bing Chat (now Copilot) is used in qualitative research, and examines strengths, limits and ethical dilemmas. AI can help as co-author, dialogue space or research assistant, but also risks unreliable results, bias and unethical outputs. It offers guidance on disclosing AI use in papers and reflects on how AI was used in writing the commentary itself."
  themes: ["倫理・公正", "透明性・研究の質"]
- id: dahal2025
  stance: "cautious"
  cite: "Dahal et al. (2025)"
  year: 2025
  title: "Navigating the meta-crisis of generativity: Adapting qualitative research quality criteria in the era of generative AI"
  title_ja: "生成性のメタクライシスを乗り切る：生成AI時代に質的研究の質の基準をどう変えるか"
  apa: "Dahal, N., Hasan, M. K., Ounissi, A., Haque, M. N., & Kapar, H. (2025). Navigating the meta-crisis of generativity: Adapting qualitative research quality criteria in the era of generative AI. Frontiers in Research Metrics and Analytics, 10, Article 1685968."
  doi: "https://doi.org/10.3389/frma.2025.1685968"
  summary: "デンジンとリンカンが指摘した質的研究の三つの危機（表象・正当化・実践）が、生成AIによって同時に深まっている。著者らはこれを「生成性のメタクライシス」と呼ぶ。表象の危機では人とAIのどちらが書いたのかが分かりにくくなり、正当化の危機では不透明で偏りうるAIの主張をどこまで信頼できるかが問題になり、実践の危機ではAIという人間でない参加者の役割が問われる。対応として、信用性をアルゴリズムの説明責任に、確証性を人とAIの対話の記録に置き換えるなど、従来の質の基準をAIを含む形に広げる表を示す。すべてのやりとりを記録する「生成的な透明性」なども提案している。著者ら自身の経験にもとづく見解論文である。"
  summary_en: "The three crises of qualitative research identified by Denzin and Lincoln (representation, legitimation, praxis) are deepening at once with generative AI; the authors call this the 'meta-crisis of generativity'. In representation, it becomes unclear whether a human or AI wrote a text; in legitimation, how far opaque and possibly biased AI claims can be trusted; in praxis, what role a non-human participant plays. In response they offer a table extending traditional quality criteria to include AI, for example recasting credibility as algorithmic accountability and confirmability as a record of human-AI dialogue, and propose 'generative transparency', recording every exchange. A viewpoint paper based on the authors' own experience."
  themes: ["透明性・研究の質", "解釈・反省性"]
- id: davison2024
  stance: "cautious"
  cite: "Davison et al. (2024)"
  year: 2024
  title: "The ethics of using generative AI for qualitative data analysis"
  title_ja: "質的データ分析に生成AIを使うことの倫理"
  apa: "Davison, R. M., Chughtai, H., Nielsen, P., Marabelli, M., Iannacci, F., van Offenbeek, M., Tarafdar, M., Trenz, M., Techatassanasoontorn, A. A., Díaz Andrade, A., & Panteli, N. (2024). The ethics of using generative AI for qualitative data analysis. Information Systems Journal, 34(5), 1433–1439."
  doi: "https://doi.org/10.1111/isj.12504"
  summary: "情報システム分野の主要誌『Information Systems Journal』の編集者・研究者11名が連名で書いた編集論説。生成AIを質的データ分析に使うことの倫理を、情報システム研究の立場から論じている。2024年という早い時期に、学術誌の編集側がこの問題を正面から取り上げたものである。"
  summary_en: "An editorial co-signed by eleven editors and researchers of Information Systems Journal, a leading journal in the field. It discusses the ethics of using generative AI for qualitative data analysis from the standpoint of information systems research. It is an early case, in 2024, of journal editors taking the issue on directly."
  themes: ["倫理・公正"]
- id: depaoli2026a
  stance: "support"
  cite: "De Paoli (2026a)"
  year: 2026
  title: "Can machines perform a qualitative data analysis? Reading the debate with Alan Turing"
  title_ja: "機械は質的データ分析を行えるか：アラン・チューリングとともに論争を読む"
  apa: "De Paoli, S. (2026a). Can machines perform a qualitative data analysis? Reading the debate with Alan Turing. Social Science Computer Review."
  doi: "https://doi.org/10.1177/08944393261451707"
  summary: "LLMを質的分析に使うことを否定する議論は、問いの立て方を誤っていると論じる。チューリングは「計算機械と知能」で、「機械は考えられるか」という抽象的な問いを、試すことのできる問いに置き換えた。著者はこれにならい、「機械に原理的に分析ができるか」ではなく、「LLMは人間の分析者に十分に匹敵する分析を出せるか」を実証的に調べるべきだとする。最後の節では、反対論の一つ一つに、チューリングと同じ文体で答えている。"
  summary_en: "Argues that arguments against using LLMs for qualitative analysis frame the question wrongly. In 'Computing Machinery and Intelligence', Turing replaced the abstract question 'Can machines think?' with one that could be tested. Following him, the author holds that we should not ask whether machines can in principle analyze, but investigate empirically whether LLMs can produce analyses that match human analysts well enough. The final section answers the objections one by one, in Turing's style."
  themes: ["分析・コーディング", "拒否声明をめぐる議論"]
- id: depaoli2026b
  stance: "support"
  cite: "De Paoli (2026b)"
  year: 2026
  title: "Why we should reject to reject the use of generative artificial intelligence in qualitative analysis: A response to Jowsey, Braun, Clarke, Lupton, and Fine (2025)"
  title_ja: "なぜ私たちは、質的分析での生成AIの使用を拒否することを拒否すべきなのか：ジョウジーらへの応答"
  apa: "De Paoli, S. (2026b). Why we should reject to reject the use of generative artificial intelligence in qualitative analysis: A response to Jowsey, Braun, Clarke, Lupton, and Fine (2025). Qualitative Inquiry."
  doi: "https://doi.org/10.1177/10778004261425137"
  summary: "ジョウジーら419名の拒否声明（2025年）への応答。声明の懸念は方法論の形をとっているが、実際には哲学的・形而上学的な前提に依拠していると指摘する。そのような根拠で生成AIを一律に禁じると、教条になりかねず、質的分析をめぐる議論と方法の革新を妨げると主張する。同じ著者は別の論文（De Paoli, 2026a）で、AIの分析が人間に匹敵するかを実証で確かめるべきだとも論じている。"
  summary_en: "A response to the 2025 rejection statement by Jowsey and 418 others. It argues that the statement's concerns take a methodological form but rest on philosophical and metaphysical premises. Banning generative AI across the board on such grounds risks becoming dogma and would block debate and methodological innovation in qualitative analysis. In another paper (De Paoli, 2026a) the same author argues that whether AI analysis matches human analysis should be tested empirically."
  themes: ["拒否声明をめぐる議論"]
- id: duke2026
  stance: "cautious"
  cite: "Duke (2026)"
  year: 2026
  title: "Artificial intelligence and the end(s) of qualitative data analysis"
  title_ja: "人工知能と、質的データ分析の終わり／目的"
  apa: "Duke, M. R. (2026). Artificial intelligence and the end(s) of qualitative data analysis. Human Organization, 85(1), 8–10."
  doi: "https://doi.org/10.1080/00187259.2025.2546439"
  summary: "人類学者による論説。AIの分析ツールに頼りすぎると、「厚い記述」の代わりに「十分に良い」薄い分析が当たり前になり、研究者と参加者のあいだの倫理的な約束も迂回され、分析をする人の技能が失われ、疎外されると警告する。コーディングは手間のかかる作業だが、機械的な作業ではなく解釈の行為であり、その苦労こそが深い洞察を生む場だとする。AIには研究者のような立ち位置がないので、分析の透明性も損なわれる。参加者の語りは研究者に義務を生む「贈り物」でもあり、とくに弱い立場にある人々の語りは自分で丁寧に読むべきだと論じる。ただし、全面禁止を主張するのではなく、議論を促すことを目的としている。"
  summary_en: "An essay by an anthropologist. Relying too much on AI analysis tools, it warns, will normalize 'good enough' thin analysis in place of thick description, bypass the ethical commitments between researchers and participants, and deskill and alienate the people doing analysis. Coding is laborious, but it is an act of interpretation, not a mechanical task, and that struggle is where deep insight arises. Because AI has no position as a researcher does, it also undermines the transparency of analysis. Participants' stories are 'gifts' that create obligations, and the stories of vulnerable people in particular should be read carefully by the researchers themselves. The essay aims to provoke discussion rather than call for a total ban."
  themes: ["解釈・反省性", "倫理・公正"]
- id: friese2026
  stance: "support"
  cite: "Friese et al. (2026)"
  year: 2026
  title: "Beyond binary positions: Making space for critical and reflexive GenAI integration in qualitative research"
  title_ja: "二項対立を超えて：質的研究に生成AIを批判的・反省的に組み込む余地をつくる"
  apa: "Friese, S., Nguyen-Trung, K., Powell, S., & Morgan, D. L. (2026). Beyond binary positions: Making space for critical and reflexive GenAI integration in qualitative research. Qualitative Inquiry."
  doi: "https://doi.org/10.1177/10778004261429393"
  summary: "419名の拒否声明への応答。技術を全面的に拒否すると、方法の発展が止まり、現在の実践が誤って描かれ、質的研究がより広い認識論的な変化から切り離されてしまうと論じる。代わりに、批判的な関与、方法論的リテラシー、倫理的責任にもとづく中間の立場を提唱する。研究者がしっかり主導し管理するかぎり、生成AIは、NVivoやMAXQDAなどのCAQDAS（質的データ分析ソフト）と同じく、反省的な探究の中でも正当な分析の支援になりうるとする。この反論にも、22か国の112名が賛同者として名を連ねた。"
  summary_en: "A response to the rejection statement by 419 researchers. Rejecting the technology outright, the authors argue, would halt methodological development, misrepresent current practice, and cut qualitative research off from wider epistemological change. They propose a middle position grounded in critical engagement, methodological literacy and ethical responsibility. As long as researchers firmly lead and control it, generative AI can be a legitimate analytic aid even within reflexive inquiry, as CAQDAS such as NVivo and MAXQDA are. This rebuttal was also signed by 112 supporters from 22 countries."
  themes: ["拒否声明をめぐる議論", "分析・コーディング"]
- id: goretzki2026
  stance: "cautious"
  cite: "Goretzki & Mahlendorf (2026)"
  year: 2026
  title: "GenAI for qualitative management accounting research: A commentary"
  title_ja: "管理会計の質的研究のための生成AI：コメンタリー"
  apa: "Goretzki, L., & Mahlendorf, M. D. (2026). GenAI for qualitative management accounting research: A commentary. Management Accounting Research, 68, Article 100962."
  doi: "https://doi.org/10.1016/j.mar.2026.100962"
  summary: "管理会計の質的研究で、生成AIがどんな場面で使えるかを検討するコメンタリー。インタビューの補助、AIによるビネット（場面を描いた短い事例）の作成、新しい解釈に対する反論役などを挙げる。一方で、AIの出力は統計的な規則性にもとづくため、分析が表面的なパターンに引き寄せられやすいと指摘する。解釈や執筆をAIに任せると、洞察が生まれる「苦闘」を手放すことになりかねないとも述べる。"
  summary_en: "A commentary on where generative AI can be used in qualitative management accounting research. It names support for interviews, AI-generated vignettes (short cases describing a scene), and AI as a devil's advocate against new interpretations. But because AI output rests on statistical regularities, analysis is easily pulled toward surface patterns. Handing interpretation and writing to AI may also mean giving up the 'struggle' from which insight comes."
  themes: ["分析・コーディング", "解釈・反省性"]
- id: hitch2024
  stance: "optimistic"
  cite: "Hitch (2024)"
  year: 2024
  title: "Artificial intelligence augmented qualitative analysis: The way of the future?"
  title_ja: "人工知能で補強された質的分析：未来のやり方か？"
  apa: "Hitch, D. (2024). Artificial intelligence augmented qualitative analysis: The way of the future? Qualitative Health Research, 34(7), 595–606."
  doi: "https://doi.org/10.1177/10497323231217392"
  summary: "言語の構造を統計的に分析し、文章を理解・生成する、NLPにもとづくAIを解説した論考。健康研究の再帰的テーマ分析にとっての利点と限界を論じ、早くから使い始めた研究者はいるものの、その可能性の理解はまだ始まったばかりだとする。もっとも身近なChatGPTを例に、再帰的テーマ分析をAIで補う手順を実例で示している。AIを使い始めたい研究者向けの、実践的な手引きとしての性格が強い。"
  summary_en: "An essay explaining NLP-based AI, which analyzes the structure of language statistically to understand and generate text. It discusses benefits and limits for reflexive thematic analysis in health research, and notes that while some researchers adopted it early, understanding of its potential has only begun. Using ChatGPT, the most familiar tool, it shows step by step how to augment reflexive thematic analysis with AI. Largely a practical guide for researchers who want to start using AI."
  themes: ["実践の手引き", "分析・コーディング"]
- id: ibrahim2026
  stance: "support"
  cite: "Ibrahim et al. (2026)"
  year: 2026
  title: "Should generative AI be used in reflexive qualitative research?"
  title_ja: "生成AIは反省的な質的研究に使われるべきか"
  apa: "Ibrahim, E. I., Nelson, L. K., & Voyer, A. (2026). Should generative AI be used in reflexive qualitative research? Qualitative Inquiry."
  doi: "https://doi.org/10.1177/10778004261456208"
  summary: "反省的な質的研究から生成AIを締め出すべきだ、という主張に異を唱える短い論考。「生成AIは単一の手法ではない」と指摘し、その多くはオープンで設定を変えられるTransformer系モデルの集まりだとする。LLMを計算論的テキスト分析の長い系譜の中に置き、文脈と全体性に注意を向ける性質は、質的な認識論と合う部分があると論じる。研究者の判断を代替せずに再帰的な分析を支える使い方を示し、技術そのものについても反省する「技術的リフレクシビティ」を提案する。"
  summary_en: "A short essay disputing the claim that generative AI should be kept out of reflexive qualitative research. It points out that generative AI is not a single method; much of it is a family of open, configurable Transformer models. Placing LLMs in the long lineage of computational text analysis, it argues that their attention to context and wholeness fits parts of qualitative epistemology. It shows uses that support reflexive analysis without replacing the researcher's judgment, and proposes 'technological reflexivity', reflecting on the technology itself."
  themes: ["解釈・反省性", "拒否声明をめぐる議論"]
- id: jones2025
  stance: "cautious"
  cite: "Jones (2025)"
  year: 2025
  title: "Generative AI in qualitative research and related transparency problems: A novel heuristic for disclosing uses of AI"
  title_ja: "質的研究における生成AIと透明性の問題：AIの使用を開示するための新しいヒューリスティック"
  apa: "Jones, K. M. L. (2025). Generative AI in qualitative research and related transparency problems: A novel heuristic for disclosing uses of AI. International Journal of Qualitative Methods, 24."
  doi: "https://doi.org/10.1177/16094069251404329"
  summary: "生成AIの仕組みは外から見えにくく、そのことが質的研究の方法の透明性を損なうと論じる。既存の報告ガイドラインは、AIの使用を開示することを想定していない。著者らは、研究チーム、参加者とのやりとり、研究デザイン、データの扱い、データ分析の五つの領域にわたる20の問いと、それぞれの開示の方法を、新しいヒューリスティック（考えるための手がかり）として示す。論文を書く側にも、査読する側にも使える内容である。"
  summary_en: "Argues that because the workings of generative AI are hard to see from outside, AI use undermines the methodological transparency of qualitative research, and existing reporting guidelines do not anticipate disclosing it. The authors offer a new heuristic of 20 questions across five areas (the research team, interaction with participants, research design, data handling, and data analysis), each with a way to disclose. Useful both for authors and for reviewers."
  themes: ["透明性・研究の質", "実践の手引き"]
- id: jowsey2025reject
  stance: "against"
  cite: "Jowsey et al. (2025)"
  year: 2025
  title: "We reject the use of generative artificial intelligence for reflexive qualitative research"
  title_ja: "私たちは、反省的な質的研究に生成人工知能を使うことを拒否する"
  apa: "Jowsey, T., Braun, V., Clarke, V., Lupton, D., & Fine, M. (2025). We reject the use of generative artificial intelligence for reflexive qualitative research. Qualitative Inquiry."
  doi: "https://doi.org/10.1177/10778004251401851"
  summary: "32か国419名の経験ある質的研究者が名を連ねた拒否声明。再帰的テーマ分析のような分析は人間の研究実践であり、主観をもち、位置づけられ、反省する研究者を必要とするので、生成AIの使用は方法論的に一致しないとする。さらに、社会正義と環境正義の観点からも使用を拒否する。読者に、自分自身はどの立場をとるのかを考えるよう呼びかけている。この声明は大きな反響を呼び、多くの反論や応答論文が書かれた。"
  summary_en: "A rejection statement signed by 419 experienced qualitative researchers from 32 countries. Analyses such as reflexive thematic analysis are human research practices that require a subjective, situated, reflexive researcher, so using generative AI is methodologically incongruent. The statement also rejects its use on grounds of social and environmental justice, and asks readers to consider where they themselves stand. It drew wide attention and prompted many rebuttals and response papers."
  themes: ["拒否声明をめぐる議論", "倫理・公正"]
- id: kempny2026
  stance: "support"
  cite: "Kempny et al. (2026)"
  year: 2026
  title: "Potenziale und Risiken beim Einsatz von KI in der qualitativen Forschung [Potentials and risks of using AI in qualitative research]"
  title_ja: "質的研究にAIを使うことの可能性とリスク"
  apa: "Kempny, C., Yilmaz-Aslan, Y., & Brzoska, P. (2026). Potenziale und Risiken beim Einsatz von KI in der qualitativen Forschung [Potentials and risks of using AI in qualitative research]. Zeitschrift für Evidenz, Fortbildung und Qualität im Gesundheitswesen, 200, 76–82."
  doi: "https://doi.org/10.1016/j.zefq.2025.10.004"
  summary: "ドイツの、医療の質とエビデンスを扱う雑誌に載ったドイツ語の論考。カテゴリーの作成、コーディング、解釈といった研究の段階ごとに、AIの可能性と限界を検討する。AIは、別の視点を出す「二人目・三人目の意見」として、研究者が自分の分析を振り返るための補助には使えるとする。しかし、質的研究の中核にある原則は自動化できないと結論づけている。"
  summary_en: "A German-language essay in a German journal on health care quality and evidence. It examines AI's potential and limits at each stage of research: building categories, coding and interpretation. AI can serve as a 'second or third opinion' offering other perspectives, helping researchers reflect on their own analysis. But the core principles of qualitative research, it concludes, cannot be automated."
  themes: ["分析・コーディング", "解釈・反省性"]
- id: lee2024
  stance: "optimistic"
  cite: "Lee et al. (2024)"
  year: 2024
  title: "Harnessing ChatGPT for thematic analysis: Are we ready?"
  title_ja: "テーマ分析にChatGPTを活用する：準備はできているか"
  apa: "Lee, V. V., van der Lubbe, S. C. C., Goh, L. H., & Valderas, J. M. (2024). Harnessing ChatGPT for thematic analysis: Are we ready? Journal of Medical Internet Research, 26, Article e54974."
  doi: "https://doi.org/10.2196/54974"
  summary: "医学研究のテーマ分析で、ChatGPTを三つの段階に使うことを検討した見解論文。三つとは、トランスクリプトを直接コーディングすること、コードのリストからテーマを作ること、論文に載せる引用を整えることである。さらに、分析の練習用にインタビュー記録を生成する使い方にも触れる。ChatGPTは参加者の文脈を完全には捉えられないが、分析チームの一員として加われば、三角測量（複数の視点による確認）に役立つと論じる。"
  summary_en: "A viewpoint paper on using ChatGPT at three stages of thematic analysis in medical research: coding transcripts directly, generating themes from a list of codes, and preparing quotations for publication. It also mentions generating interview transcripts for analysis practice. ChatGPT cannot fully grasp participants' contexts, but as a member of the analysis team it can help with triangulation (checking from several perspectives)."
  themes: ["実践の手引き", "分析・コーディング"]
- id: mendoza2026
  stance: "support"
  cite: "Mendoza & Quilantang (2026)"
  year: 2026
  title: "In relation, not replacement: A reflexive case for generative AI in qualitative research"
  title_ja: "置き換えではなく、関係の中で：質的研究における生成AIのための反省的な論"
  apa: "Mendoza, K. P. R., & Quilantang, R. F. (2026). In relation, not replacement: A reflexive case for generative AI in qualitative research. Qualitative Research Journal."
  doi: "https://doi.org/10.1108/QRJ-11-2025-0428"
  summary: "技術による媒介は意味の生成を損なう、という前提に異議を唱え、むしろ媒介こそが反省性の条件だと論じる。関係的な実践、部分的な修復、反省的な多元主義という三つの概念を示し、AIとの「生産的な摩擦」が研究者の判断を鋭くするとする。グローバル・サウスの研究者や神経多様性のある研究者など、構造的な制約の下で働く人々にとって、AIの全面禁止が公正さの問題を生むことにも触れている。"
  summary_en: "Challenges the premise that technological mediation damages meaning-making, arguing instead that mediation is a condition of reflexivity. It offers three concepts, relational practice, partial repair and reflexive pluralism, and holds that 'productive friction' with AI sharpens the researcher's judgment. It also notes that a total ban on AI raises equity problems for people working under structural constraints, such as researchers in the Global South and neurodivergent researchers."
  themes: ["解釈・反省性", "倫理・公正", "拒否声明をめぐる議論"]
- id: nguyen2026bas
  stance: "against"
  cite: "Nguyen & Welch (2026)"
  year: 2026
  title: "Engaged and responsible scholarship: Why qualitative researchers should not embrace GenAI"
  title_ja: "関与と責任ある研究：なぜ質的研究者は生成AIを受け入れるべきではないのか"
  apa: "Nguyen, D. C., & Welch, C. (2026). Engaged and responsible scholarship: Why qualitative researchers should not embrace GenAI. Business & Society, 65(7), 1787–1792."
  doi: "https://doi.org/10.1177/00076503251386539"
  summary: "経営と社会の関係を扱う雑誌に載った論考。生成AIを質的研究者と研究対象のあいだに置くと、意味があり、認識論的に健全な知が生まれる条件そのものが置き換えられ、歪められると論じる。そうした媒介は、研究の場に深く関わる「関与する研究」や、責任ある研究の原則とも相容れないとする。分析は「自動化すべき隘路ではなく、研究の場への欠かせない没入」だという主張が中心にある。"
  summary_en: "An essay in a journal on business and society. Placing generative AI between qualitative researchers and what they study, it argues, replaces and distorts the very conditions under which meaningful, epistemically sound knowledge arises. Such mediation is incompatible with engaged scholarship, deeply involved in the research setting, and with the principles of responsible research. Its central claim: analysis is 'not a bottleneck to be automated but an essential immersion in the research setting'."
  themes: ["解釈・反省性", "倫理・公正"]
- id: nolan2025
  stance: "support"
  cite: "Nolan (2025)"
  year: 2025
  title: "“Can’t help myself”: On generative AI, the performance of qualitative research and slow scholarship"
  title_ja: "「Can't Help Myself」：生成AI、質的研究のパフォーマンス、スロー・スカラシップ"
  apa: "Nolan, R. (2025). “Can’t help myself”: On generative AI, the performance of qualitative research and slow scholarship. Qualitative Research, 25(6), 1473–1479."
  doi: "https://doi.org/10.1177/14687941241308696"
  summary: "孫原と彭禹のアート作品「Can't Help Myself」（こぼれ続ける液体を、ロボットアームが休みなくかき集める作品）をメタファーにしたエッセイ。生成AI、成果を求める学術界の圧力、時間をかけて考える「スロー・スカラシップ」が交わるところを論じる。AIに圧倒される恐れから一歩離れ、深みと熟考を可能にする形でAIを取り入れることを提案している。"
  summary_en: "An essay built on the metaphor of Sun Yuan and Peng Yu's artwork 'Can't Help Myself', in which a robotic arm endlessly sweeps up a constantly leaking liquid. It discusses where generative AI, academic pressure to produce, and 'slow scholarship' that takes time to think meet. It proposes stepping back from the fear of being overwhelmed by AI and taking AI in in ways that allow depth and reflection."
  themes: ["解釈・反省性"]
- id: pillai2025
  stance: "cautious"
  cite: "Pillai & Matus (2025)"
  year: 2025
  title: "Regulatory solutions to alleviate the risks of generative AI models in qualitative research"
  title_ja: "質的研究における生成AIのリスクを軽減するための規制による解決策"
  apa: "Pillai, V. S., & Matus, K. (2025). Regulatory solutions to alleviate the risks of generative AI models in qualitative research. Journal of Asian Public Policy, 18(2), 482–505."
  doi: "https://doi.org/10.1080/17516234.2024.2399098"
  summary: "生成AIが査読者、研究者、研究対象者（3R）にもたらすリスクを、文献調査、質的研究者とのリスク・ワークショップ、インタビューから整理した研究。EU、シンガポール、米国、英国、中国のAI政策と比べて、規制の空白を特定する。そのうえで、拘束力のない指針（ソフトロー）から法的な規制（ハードロー）までの連続体の上に、必要な規制介入を位置づけて示している。"
  summary_en: "A study that maps the risks generative AI poses to reviewers, researchers and research subjects (the '3Rs'), using a literature review, risk workshops with qualitative researchers, and interviews. Comparing AI policies in the EU, Singapore, the US, the UK and China, it identifies regulatory gaps, then places the needed interventions on a continuum from non-binding guidance (soft law) to legal regulation (hard law)."
  themes: ["雑誌・制度の方針", "倫理・公正"]
- id: pink2025
  stance: "support"
  cite: "Pink (2025)"
  year: 2025
  title: "Artificial intelligence and the futures turn: An anticipatory infrastructure for qualitative methods"
  title_ja: "人工知能と未来への転回：質的方法のための予見的インフラ"
  apa: "Pink, S. (2025). Artificial intelligence and the futures turn: An anticipatory infrastructure for qualitative methods. Qualitative Research in Psychology."
  doi: "https://doi.org/10.1080/14780887.2025.2570167"
  summary: "AIによる予測が「未来についての知識」の市場を占めつつある状況で、社会科学の未来研究の中にAIを位置づける論考。質的な未来志向のチーム研究で生成AIを使ったときの「副作用」を、反省的に考察している。生成AIを、正解を出す道具としてではなく、人々が未来を想像するための予見的なインフラとして捉えることを提案する。"
  summary_en: "As AI prediction comes to dominate the market for 'knowledge about the future', this essay places AI within futures research in the social sciences. It reflects on the 'side effects' of using generative AI in qualitative, future-oriented team research, and proposes seeing generative AI not as a tool that produces right answers but as an anticipatory infrastructure through which people imagine futures."
  themes: ["解釈・反省性"]
- id: prahl2026
  stance: "cautious"
  cite: "Prahl (2026)"
  year: 2026
  title: "The AI-Reflexivity Checklist (ARC): A pre-analysis pause for LLM-assisted coding"
  title_ja: "AI反省性チェックリスト（ARC）：LLMでコーディングする前に立ち止まるために"
  apa: "Prahl, A. (2026). The AI-Reflexivity Checklist (ARC): A pre-analysis pause for LLM-assisted coding. Qualitative Health Research, 36(2–3), 181–190."
  doi: "https://doi.org/10.1177/10497323251401503"
  summary: "LLMを使ったコーディングを始める前に、いったん立ち止まって確認するためのチェックリスト（ARC）を提案する。記述の範囲、文脈による意味の変わりやすさ、経験の深さ、倫理的な曝露、出力をやり直せるかどうか、の五つの領域を順に確かめ、その作業を自動化してよいか、AIは支援にとどめるか、人間が主導するかを決める。「認識できることは、責任を負うことではない」という一文が、全体の考え方をよく表している。"
  summary_en: "Proposes a checklist (ARC) for pausing to check before starting LLM-assisted coding. It goes through five domains in order: descriptive scope, how much meaning depends on context, depth of experience, ethical exposure, and whether the output can be redone, and on that basis decides whether the task may be automated, whether AI should only assist, or whether a human should lead. One line sums up its approach: 'recognition is not responsibility'."
  themes: ["実践の手引き", "解釈・反省性"]
- id: quinn2026
  stance: "cautious"
  cite: "Quinn et al. (2026)"
  year: 2026
  title: "Navigating the rise of artificial intelligence and imposter participants in qualitative health research"
  title_ja: "質的健康研究における人工知能と「なりすまし参加者」の増加にどう対処するか"
  apa: "Quinn, S., Richards, N., Williams, J., Mogan, C., Myall, M., Lloyd-Williams, M., & Calman, L. (2026). Navigating the rise of artificial intelligence and imposter participants in qualitative health research. International Journal of Qualitative Methods, 25."
  doi: "https://doi.org/10.1177/16094069261431990"
  summary: "英国のオンライン・インタビュー研究で、LLMで生成された、あるいはLLMに手伝わせた偽の応募が数百件届いた経験を報告する。定型的な言い回し、病気についての曖昧な説明、郵便番号の不自然さなどの兆候を挙げ、デジタル機器に不慣れな人を排除しないよう配慮しながら「なりすまし参加者」を見分ける手順を示す。参加者を疑うことと信頼することのあいだにある、倫理的な緊張についても論じている。"
  summary_en: "Reports receiving hundreds of fake applications, generated by or written with help from LLMs, in an online interview study in the UK. It lists warning signs such as formulaic phrasing, vague descriptions of illness and unlikely postcodes, and sets out a procedure for spotting 'imposter participants' while taking care not to exclude people unfamiliar with digital devices. It also discusses the ethical tension between suspecting and trusting participants."
  themes: ["倫理・公正", "実践の手引き"]
- id: roberts2024
  stance: "cautious"
  cite: "Roberts et al. (2024)"
  year: 2024
  title: "Artificial intelligence and qualitative research: The promise and perils of large language model (LLM) “assistance”"
  title_ja: "人工知能と質的研究：大規模言語モデルの「支援」の約束と危うさ"
  apa: "Roberts, J., Baker, M., & Andrew, J. (2024). Artificial intelligence and qualitative research: The promise and perils of large language model (LLM) “assistance.” Critical Perspectives on Accounting, 99, Article 102722."
  doi: "https://doi.org/10.1016/j.cpa.2024.102722"
  summary: "会計学の批判的研究の雑誌に載った論考。LLMが人間らしく見えるのは、人間が、模倣しかできない仕組みにコミュニケーションの意図を投影しているからだと論じる。確信に満ちた口調、幻覚や迎合の傾向、倫理的な感覚と責任能力の欠如が、その人間らしさを欺瞞的なものにしているとする。最後に、質的研究者として人間にしかできないことは何かを考察している。"
  summary_en: "An essay in a journal of critical accounting research. LLMs seem human, it argues, because people project communicative intent onto a system that can only imitate. Its confident tone, its tendency to hallucinate and to please, and its lack of ethical sense and accountability make that humanness deceptive. It ends by asking what only humans can do as qualitative researchers."
  themes: ["解釈・反省性", "倫理・公正"]
- id: sibeoni2026
  stance: "support"
  cite: "Sibeoni et al. (2026)"
  year: 2026
  title: "AI and qualitative health research: Working through a necessary grieving process"
  title_ja: "AIと質的健康研究：避けられない喪の過程をくぐり抜ける"
  apa: "Sibeoni, J., Verneuil, L., Manolios, E., Meunier, J.-P., Ponsard, C., Mathé, J., & Revah-Lévy, A. (2026). AI and qualitative health research: Working through a necessary grieving process. Qualitative Health Research."
  doi: "https://doi.org/10.1177/10497323261417237"
  summary: "LLMの急速な普及に揺さぶられている質的健康研究の状況を、キューブラー＝ロスの悲嘆の五段階（否認・怒り・取引・抑うつ・受容）を使って描く。問われているのは効率ではなく、質的研究者としてのアイデンティティそのものだとする。そのうえで、集合的なプロンプト作成、AIの出力を皆で批判的に点検する「コーディング・リトリート」、使用の明示的な開示などの実践を提案する。著者ら自身、この見取り図を「挑発的だが建設的」だと述べている。"
  summary_en: "Uses Kübler-Ross's five stages of grief (denial, anger, bargaining, depression, acceptance) to describe qualitative health research shaken by the rapid spread of LLMs. What is at stake, it argues, is not efficiency but qualitative researchers' identity itself. It proposes practices such as collective prompt writing, 'coding retreats' where outputs are critically examined together, and explicit disclosure of use. The authors call their own map 'provocative but constructive'."
  themes: ["拒否声明をめぐる議論", "実践の手引き"]
- id: prescott2024
  stance: "comparison"
  cite: "Prescott et al. (2024)"
  year: 2024
  title: "Comparing the efficacy and efficiency of human and generative AI: Qualitative thematic analyses"
  title_ja: "人間と生成AIの有効性と効率を比べる：質的テーマ分析"
  apa: "Prescott, M. R., Yeager, S., Ham, L., Rivera Saldana, C. D., Serrano, V., Narez, J., Paltin, D., Delgado, J., Moore, D. J., & Montoya, J. (2024). Comparing the efficacy and efficiency of human and generative AI: Qualitative thematic analyses. JMIR AI, 3, e54482."
  doi: "https://doi.org/10.2196/54482"
  summary: "HIVの服薬支援のために送られたSMSの文面40件を、二つの人間のチームと、ChatGPT・Bardを使う別の分析者で、それぞれ帰納的・演繹的にテーマ分析して比べた。帰納的分析では、人間のテーマ7つのうち5つ（71%）をAIも見つけた。演繹的分析での一致はChatGPTが50%、Bardが58%だった。コード単位の一致率は36〜47%で「まずまず〜中程度」にとどまった。所要時間はAIが平均約20分、人間が約567分だった。著者らは、ニュアンスのある解釈的なテーマは人間の方が得意だとして、人とAIを組み合わせる方法を勧めている。"
  summary_en: "Forty SMS messages sent to support HIV medication adherence were analyzed thematically, inductively and deductively, by two human teams and by separate analysts using ChatGPT and Bard. In the inductive analysis, AI found 5 of the 7 human themes (71%). In the deductive analysis, agreement was 50% for ChatGPT and 58% for Bard. Code-level agreement was 36–47%, only 'fair to moderate'. AI took about 20 minutes on average, humans about 567. The authors recommend combining humans and AI, since humans are better at nuanced, interpretive themes."
  themes: ["分析・コーディング"]
- id: sakaguchi2025
  stance: "comparison"
  cite: "Sakaguchi et al. (2025)"
  year: 2025
  title: "Evaluating ChatGPT in qualitative thematic analysis with human researchers in the Japanese clinical context and its cultural interpretation challenges: Comparative qualitative study"
  title_ja: "日本の臨床の文脈での質的テーマ分析におけるChatGPTの評価と、文化的解釈の課題：比較質的研究"
  apa: "Sakaguchi, K., Sakama, R., & Watari, T. (2025). Evaluating ChatGPT in qualitative thematic analysis with human researchers in the Japanese clinical context and its cultural interpretation challenges: Comparative qualitative study. Journal of Medical Internet Research, 27, e71521."
  doi: "https://doi.org/10.2196/71521"
  summary: "日本の病院で行われた面接30件を、ChatGPT-4と人間の研究者がそれぞれテーマ分析し、結果を比べた研究。記述的なテーマでは80%以上が一致した。しかし、文化や感情の解釈が必要なテーマでは、一致は約30%にとどまった。日本語のデータと日本の臨床の文脈で、AIが何を拾い、何を取りこぼすのかを具体的に示している点で、日本の研究者にとって参考になる。"
  summary_en: "Thirty interviews conducted at a Japanese hospital were analyzed thematically by ChatGPT-4 and by human researchers, and the results compared. Descriptive themes agreed more than 80% of the time, but themes that required cultural or emotional interpretation agreed only about 30%. It shows concretely what AI picks up and what it misses with Japanese data in a Japanese clinical setting."
  themes: ["分析・コーディング"]
- id: mizumoto2025
  stance: "comparison"
  cite: "Mizumoto & Teng (2025)"
  year: 2025
  title: "Large language models fall short in classifying learners' open-ended responses"
  title_ja: "大規模言語モデルは、学習者の自由記述の分類で力不足である"
  apa: "Mizumoto, A., & Teng, M. F. (2025). Large language models fall short in classifying learners' open-ended responses. Research Methods in Applied Linguistics, 4(2), 100210."
  doi: "https://doi.org/10.1016/j.rmal.2025.100210"
  summary: "英語を学ぶ日本の大学生143名が、英作文をどう書いたかを自由記述で答えたデータを使った研究。回答を、自己調整学習の「計画・モニタリング・評価」のどれに当たるかで分類し、2名の人間の評定を基準に、複数のLLMの分類と比べた。最も良かったDeepSeek-V3でも一致度はκ=0.68で、強い一致の目安（0.8）に届かなかった。ほかのモデルは0.37〜0.61だった。一部のオープンソースのモデルが商用モデルを上回ったことも報告している。著者らは、LLMはまだ人間のコーディングの代わりにはならず、専門家の監督が必要だと結論づけている。"
  summary_en: "Uses open-ended answers from 143 Japanese university students learning English about how they wrote English essays. The answers were classified into planning, monitoring or evaluation in self-regulated learning, and several LLMs were compared against two human raters. Even the best, DeepSeek-V3, reached only κ = 0.68, short of the usual mark for strong agreement (0.8); other models ranged from 0.37 to 0.61. Some open-source models outperformed commercial ones. The authors conclude that LLMs cannot yet replace human coding and need expert supervision."
  themes: ["分析・コーディング"]
- id: bennis2025
  stance: "comparison"
  cite: "Bennis & Mouwafaq (2025)"
  year: 2025
  title: "Advancing AI-driven thematic analysis in qualitative research: A comparative study of nine generative models on cutaneous leishmaniasis data"
  title_ja: "AIによるテーマ分析を進める：皮膚リーシュマニア症のデータを用いた9つの生成モデルの比較研究"
  apa: "Bennis, I., & Mouwafaq, S. (2025). Advancing AI-driven thematic analysis in qualitative research: A comparative study of nine generative models on cutaneous leishmaniasis data. BMC Medical Informatics and Decision Making."
  doi: "https://doi.org/10.1186/s12911-025-02961-5"
  summary: "皮膚リーシュマニア症の傷あとが人の心理や社会生活に与える影響について集めた回答448件を、専門家の手作業の分析と、9つの生成AI（Claude 3.5 Sonnet、ChatGPT o1、Gemini、DeepSeek V3、Llama 3.1など）で分析して比べた。一致度はκ係数とJaccard係数で測った。上位のモデルは基準となる分析と強く一致し、一部は完全に一致した（Jaccard係数1.00）。著者らは、AIを質的方法に取り入れられると評価しつつ、人間の専門性と組み合わせ、標準化されたチェックリストで過程を透明に報告することを勧めている。"
  summary_en: "448 responses about how cutaneous leishmaniasis scars affect people's psychological and social lives were analyzed manually by experts and by nine generative AI models (including Claude 3.5 Sonnet, ChatGPT o1, Gemini, DeepSeek V3 and Llama 3.1). Agreement was measured with kappa and Jaccard coefficients. The top models agreed strongly with the reference analysis, some perfectly (Jaccard 1.00). The authors judge that AI can be brought into qualitative methods, but recommend combining it with human expertise and reporting the process transparently with a standardized checklist."
  themes: ["分析・コーディング"]
- id: lockwood2026
  stance: "comparison"
  cite: "Lockwood et al. (2026)"
  year: 2026
  title: "Human versus machine: A comparative analysis of qualitative coding by humans and ChatGPT-4"
  title_ja: "人間 対 機械：人間とChatGPT-4による質的コーディングの比較分析"
  apa: "Lockwood, A., Newman, D. S., Mossing, K. W., Glubzinski, A., & Cohen, E. (2026). Human versus machine: A comparative analysis of qualitative coding by humans and ChatGPT-4. School Psychology, 41(2), 161–172."
  doi: "https://doi.org/10.1037/spq0000715"
  summary: "学校心理学の養成課程の教員60名が、コロナ禍での評価の実践について答えた自由記述を、ChatGPT-4と、経験の浅い人間の研究者がそれぞれ質的内容分析した。コード、カテゴリー、テーマ、中心となるストーリーまで、過程と結果の両方を比べている。AIの結果は人間とおおむね似ていて、ずっと短い時間で終わった。ただし、AIの分析過程は外から見えず、一部のコードやテーマは意味が不明瞭だった。人間のコーディングは、あとから点検でき、筋の通ったテーマにたどり着ける点で優れていた。"
  summary_en: "Open-ended answers from 60 school psychology training faculty about assessment practices during COVID-19 were analyzed with qualitative content analysis by ChatGPT-4 and by a novice human researcher. The study compares both process and results, from codes and categories to themes and the central storyline. AI results were broadly similar to the human ones and took far less time. But the AI's process could not be seen from outside, and some codes and themes were unclear. Human coding was better in that it could be checked afterwards and reached coherent themes."
  themes: ["分析・コーディング"]
- id: jowsey2025frank
  stance: "comparison"
  cite: "Jowsey et al. (2025)"
  year: 2025
  title: "Frankenstein, thematic analysis and generative artificial intelligence: Quality appraisal methods and considerations for qualitative research"
  title_ja: "フランケンシュタイン、テーマ分析、生成人工知能：質的研究のための質の評価方法と考慮点"
  apa: "Jowsey, T., Stapleton, P., Campbell, S., Davidson, A., McGillivray, C., Maugeri, I., Lee, M., & Keogh, J. (2025). Frankenstein, thematic analysis and generative artificial intelligence: Quality appraisal methods and considerations for qualitative research. PLOS ONE, 20(9), e0330217."
  doi: "https://doi.org/10.1371/journal.pone.0330217"
  summary: "分析データを公開している健康研究5本を選び、Microsoft Copilotに同じデータを各3回分析させて、元の論文の人間の分析と比べた。Copilotが示した引用の平均58%は、データの中に存在しない捏造だった。人間の論文の引用は、平均79%が正確だった。Copilotの引用は、データの最初の2〜3ページに偏っていた。2024年のモデルを使った研究だが、AIによる分析の質をどう評価するかという方法の提案としても読める。この研究のあと、419名の拒否声明が出た。"
  summary_en: "Five health studies with published analysis data were selected; Microsoft Copilot analyzed each dataset three times and was compared with the human analysis in the original papers. On average 58% of the quotations Copilot gave did not exist in the data: they were fabricated. On average 79% of the quotations in the human papers were accurate. Copilot's quotations clustered in the first two or three pages of the data. The study used 2024 models, but can also be read as a proposed method for evaluating the quality of AI analysis. The 419-signatory rejection statement followed this study."
  themes: ["分析・コーディング", "透明性・研究の質"]
- id: hill2026
  stance: "comparison"
  cite: "Hill et al. (2026)"
  year: 2026
  title: "Large language models for thematic analysis in healthcare research: A blinded mixed-methods comparison with human analysts"
  title_ja: "医療研究のテーマ分析のための大規模言語モデル：人間の分析者との盲検化された混合研究法による比較"
  apa: "Hill, C., Dahil, A., Simpson, G., Hardisty, D., Keast, J., Pinn, C. K., & Dambha-Miller, H. (2026). Large language models for thematic analysis in healthcare research: A blinded mixed-methods comparison with human analysts. PLOS Digital Health, 5(4), Article e0001189."
  doi: "https://doi.org/10.1371/journal.pdig.0001189"
  summary: "フォーカスグループ1回分（7名、約1.2万語）のデータを、ChatGPT-5、Claude 4 Sonnet、QualiGPTと、盲検化された2名の人間の分析者が分析した。演繹的コーディングの一致率は、AIが93.5%、人間が92.7%で、AIは人間に劣らなかった。帰納的な分析では、人間に劣らなかったのはChatGPT-5だけだった。著者らの結論は、AIは人間の分析者の「代わりではなく、補助として」使うべきだ、というものである。"
  summary_en: "Data from one focus group (7 people, about 12,000 words) were analyzed by ChatGPT-5, Claude 4 Sonnet, QualiGPT and two blinded human analysts. In deductive coding, agreement was 93.5% for AI and 92.7% for humans, so AI was non-inferior. In inductive analysis, only ChatGPT-5 was non-inferior to humans. The authors conclude that AI should be used 'as an adjunct, not a replacement' for human analysts."
  themes: ["分析・コーディング"]
- id: levitt2026
  stance: "against"
  cite: "Levitt (2026)"
  year: 2026
  title: "A consideration of the ethics and methodological integrity of generative artificial intelligence in qualitative research: Guidelines for Qualitative Psychology"
  title_ja: "質的研究における生成人工知能の倫理と方法論的整合性の検討：『Qualitative Psychology』のガイドライン"
  apa: "Levitt, H. M. (2026). A consideration of the ethics and methodological integrity of generative artificial intelligence in qualitative research: Guidelines for Qualitative Psychology. Qualitative Psychology."
  doi: "https://doi.org/10.1037/qup0000353"
  policy_url: "https://www.apa.org/pubs/journals/qua/ai-policy"
  summary: "APAの雑誌『Qualitative Psychology』の、生成AIについての方針を示した編集論文。倫理、科学性、方法論的整合性、社会的公正、環境の観点から問題を整理している。そのうえで、文献レビュー、方法の記述、データの収集と分析、結果の記述、解釈などにAIを使うことを禁じる。引用や参考文献を探すときに、AIを唯一の、主要な、または確かめていない情報源として使うことも禁じる。翻訳や文単位の修正については、別の指針を示している。"
  summary_en: "An editorial setting out the policy on generative AI of the APA journal Qualitative Psychology. It organizes the problems in terms of ethics, scientific quality, methodological integrity, social justice and the environment. On that basis it prohibits using AI for literature reviews, describing methods, collecting and analyzing data, reporting results, and interpretation, and prohibits using AI as the sole, primary or unverified source when searching for citations and references. Separate guidance covers translation and sentence-level editing."
  themes: ["雑誌・制度の方針", "倫理・公正"]
- id: nguyen2026orm
  stance: "cautious"
  cite: "Nguyen & Welch (2026)"
  year: 2026
  title: "Generative artificial intelligence in qualitative data analysis: Analyzing—or just chatting?"
  title_ja: "質的データ分析における生成人工知能：分析しているのか、ただ雑談しているだけか"
  apa: "Nguyen, D. C., & Welch, C. (2026). Generative artificial intelligence in qualitative data analysis: Analyzing—or just chatting? Organizational Research Methods."
  doi: "https://doi.org/10.1177/10944281251377154"
  summary: "生成AIが質的データ分析の「分析ツール」と言えるのかを、技術と方法論の両面から検討した論文。著者ら自身の分析の試み、既存研究との比較、質的分析ソフトに組み込まれたAI機能の検証を行っている。その結果、LLMのチャットボットは、検索、コーディング、意味の解釈、理論的な抽象化を安定してこなせないとする。さらに、もっともらしい応答が分析のように見えてしまうこと自体が、認識論的なリスクを生むと論じる。"
  summary_en: "Examines, technically and methodologically, whether generative AI can count as an 'analysis tool' for qualitative data analysis. The authors report their own attempts at analysis, compare existing studies, and test the AI features built into qualitative analysis software. They find that LLM chatbots cannot reliably search, code, interpret meaning or abstract theoretically, and argue that plausible responses that look like analysis themselves create epistemic risk."
  themes: ["分析・コーディング", "解釈・反省性"]
- id: brailas2025
  stance: "support"
  cite: "Brailas (2025)"
  year: 2025
  title: "Artificial intelligence in qualitative research: Beyond outsourcing data analysis to the machine"
  title_ja: "質的研究における人工知能：データ分析を機械に外注することを超えて"
  apa: "Brailas, A. (2025). Artificial intelligence in qualitative research: Beyond outsourcing data analysis to the machine. Psychology International, 7(3), Article 78."
  doi: "https://doi.org/10.3390/psycholint7030078"
  summary: "AIを使う質的心理学研究の可能性とリスクを、関係論的・社会構成主義的な認識論から検討した論文。AIを中立で客観的な分析機械とみなし、分析をそのまま任せてしまう発想を批判する。代わりに、研究者の解釈、文脈への感受性、反省性、インフォームド・コンセントを保ちながら、AIを考えを広げるための対話相手として慎重に位置づける枠組みを提案している。"
  summary_en: "Examines the possibilities and risks of AI in qualitative psychology from relational and social-constructionist epistemologies. It criticizes the idea of AI as a neutral, objective analysis machine to which analysis can simply be handed over. Instead, it proposes a framework that carefully positions AI as a dialogue partner for widening thinking, while preserving the researcher's interpretation, sensitivity to context, reflexivity and informed consent."
  themes: ["解釈・反省性", "倫理・公正"]
- id: vandenberkmortel2026
  stance: "comparison"
  cite: "van den Berkmortel et al. (2026)"
  year: 2026
  title: "Analyzing nurse sentiment in a Dutch regional newspaper during the COVID-19 pandemic: Comparative content analysis of GPT-5, Gemini 2.5 Pro, and human coding"
  title_ja: "コロナ禍のオランダの地方紙に見る看護師への感情の分析：GPT-5、Gemini 2.5 Pro、人間によるコーディングの比較内容分析"
  apa: "van den Berkmortel, B., Westra, D., Gifford, R., & van de Baan, F. C. (2026). Analyzing nurse sentiment in a Dutch regional newspaper during the COVID-19 pandemic: Comparative content analysis of GPT-5, Gemini 2.5 Pro, and human coding. Journal of Medical Internet Research, 28, e98374."
  doi: "https://doi.org/10.2196/98374"
  summary: "オランダの地方紙『De Limburger』に載った、コロナ禍の看護師についての記事317本を、GPT-5、Gemini 2.5 Pro、人間がそれぞれコーディングして比べた。31本の記事を使った信頼性の分析では、GPT-5と人間の一致はα=0.49、Geminiと人間は0.51で、人間どうしの一致（0.70）に届かなかった。著者らは、AIはある内容が「書かれているかどうか」でコードをつけ、人間は記事の中での「解釈上の重み」を優先する、と違いをまとめている。GPT-5の世代になっても、何を基準にするかで結論が大きく変わることを示す研究である。"
  summary_en: "317 articles about nurses during COVID-19 in the Dutch regional newspaper De Limburger were coded by GPT-5, Gemini 2.5 Pro and humans, and compared. In a reliability analysis of 31 articles, agreement was α = 0.49 between GPT-5 and humans and 0.51 between Gemini and humans, short of agreement between humans (0.70). The authors summarize the difference: AI codes by whether something is mentioned, humans by its interpretive weight in the article. Even in the GPT-5 generation, the conclusion depends heavily on which standard is used."
  themes: ["分析・コーディング"]
- id: greenhalgh2026
  stance: "support"
  cite: "Greenhalgh (2026)"
  year: 2026
  title: "Reflexive qualitative research and generative AI: A call to go beyond the binary"
  title_ja: "反省的な質的研究と生成AI：二分法を超えるための呼びかけ"
  apa: "Greenhalgh, T. (2026). Reflexive qualitative research and generative AI: A call to go beyond the binary. Qualitative Inquiry."
  doi: "https://doi.org/10.1177/10778004261429383"
  summary: "『Qualitative Inquiry』に載った論説。生成AIをめぐる議論は、無批判に取り入れる人と、原則として拒む人の二極に分かれてしまっていると指摘する。最近の立場声明や論説をふまえ、419名の拒否声明が示した懸念には同意しつつも、全面的な拒否は正当化されないと論じる。採用か拒否かではなく、「誰が解釈の権威をもつのか」を問うべきだとしている。"
  summary_en: "An essay in Qualitative Inquiry. It observes that debate about generative AI has split into two poles: those who adopt it uncritically and those who reject it on principle. Drawing on recent position statements and essays, it shares the concerns of the 419-signatory rejection statement but argues that wholesale rejection is not justified. The question to ask is not adoption or rejection, but who holds interpretive authority."
  themes: ["拒否声明をめぐる議論", "解釈・反省性"]
- id: matta2026
  stance: "cautious"
  cite: "Matta et al. (2026)"
  year: 2026
  title: "AI could undermine qualitative research. Luckily, we have a plan"
  title_ja: "AIは質的研究を損ないうる。幸い、私たちには計画がある"
  apa: "Matta, C., Nordmark, S., & Masiello, I. (2026). AI could undermine qualitative research. Luckily, we have a plan. International Journal of Qualitative Methods, 25."
  doi: "https://doi.org/10.1177/16094069261456950"
  summary: "AIを全面的に受け入れるのでも拒否するのでもない、中間の立場の論考。AIに頼ると、ありきたりな解釈に寄っていく「解釈の保守化」と、解釈の幅がやせていく「解釈の枯渇」が起きうると警告する。そのうえで、人間の解釈、テキストマイニング、AIの三つを組み合わせ、互いの弱点を補い合う方法を提案している。"
  summary_en: "An essay taking a middle position, neither fully embracing nor rejecting AI. Relying on AI, it warns, risks 'interpretive conservatism', drifting toward commonplace readings, and 'interpretive depletion', a narrowing range of interpretations. It proposes combining human interpretation, text mining and AI so that each makes up for the others' weaknesses."
  themes: ["解釈・反省性", "分析・コーディング"]
- id: goh2026
  stance: "optimistic"
  cite: "Goh (2026)"
  year: 2026
  title: "Qualitative researchers' AI rejection is based on identity, not reason"
  title_ja: "質的研究者のAI拒否は、理性ではなくアイデンティティにもとづいている"
  apa: "Goh, J. (2026, January 16). Qualitative researchers' AI rejection is based on identity, not reason. Times Higher Education."
  doi: "https://www.timeshighereducation.com/opinion/qualitative-researchers-ai-rejection-based-identity-not-reason"
  summary: "高等教育の専門誌『Times Higher Education』に載った論説。419名の拒否声明は、理性的な判断ではなく、質的研究者としての職業的なアイデンティティを守ろうとするものだと批判する。全面的な禁止は、資源の少ない研究機関の研究者から研究の力を奪うことになると論じる。ただし、筆者はAIで質的分析を行うサービス（Evidano、旧AILYZE）の創業者でCEOであり、この問題に利害関係がある点に注意が必要である。"
  summary_en: "An opinion piece in Times Higher Education. It criticizes the 419-signatory rejection statement as an effort to protect qualitative researchers' professional identity rather than a reasoned judgment, and argues that a total ban would take research capacity away from researchers at less-resourced institutions. Note that the author is founder and CEO of a service that performs qualitative analysis with AI (Evidano, formerly AILYZE) and has a stake in the issue."
  themes: ["拒否声明をめぐる議論"]
