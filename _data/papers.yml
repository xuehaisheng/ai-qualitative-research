  apa: "van den Berkmortel, B., Westra, D., Gifford, R., & van de Baan, F. C. (2026). Analyzing nurse sentiment in a Dutch regional newspaper during the COVID-19 pandemic: Comparative content analysis of GPT-5, Gemini 2.5 Pro, and human coding. Journal of Medical Internet Research, 28, e98374."
  doi: "https://doi.org/10.2196/98374"
  summary: "オランダの地方紙『De Limburger』に載った、コロナ禍の看護師についての記事317本を、GPT-5、Gemini 2.5 Proと人間でコーディングして比べた。31記事での信頼性分析で、GPT-5と人間の一致はα=0.49、Geminiは0.51で、人間どうしの0.70に届かなかった。AIは「書かれているか」をコードし、人は「解釈上の重み」を優先する、とまとめている。"
  tags: ["健康研究"]
