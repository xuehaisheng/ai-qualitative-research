ai-literacy-2026:
  title: "質的研究者のためのAIリテラシー"
  note: "日本質的心理学会第23回大会の前日講習会（2026年10月30日）で話した内容を、一つずつの記事にまとめたシリーズである。数字や出来事は講習会の時点のものである。"
  topics:
    - key: lens
      name: "たとえと見取り図"
      desc: "AIについて考えるときのたとえと、全体を見渡すための見取り図。"
    - key: mechanism
      name: "AIの仕組み"
      desc: "生成AIがどう動いているかを理解するための、基本の用語。"
    - key: history
      name: "AIの歴史と出来事"
      desc: "2017年のTransformer論文から2026年までの、主な技術と出来事。"
    - key: properties
      name: "研究で分かったAIの性質"
      desc: "AIを使うときに知っておきたいクセや限界を、研究の結果からまとめる。"
    - key: views
      name: "AIをどう見るか"
      desc: "AIは理解しているのか、この先どうなるのか。研究者の見方と、言葉や知識を扱う他分野の反応。"
    - key: qual
      name: "質的研究とAI"
      desc: "質的研究者はAIをどう試し、どう議論してきたか。"
    - key: practice
      name: "研究でAIを使う"
      desc: "質的メタ統合をAIと一緒に進めた記録と、すぐに試せる使い方。"
