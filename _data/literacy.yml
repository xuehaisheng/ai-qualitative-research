# AIリテラシーの項目。groups の順に表示する。
# 各項目：id（ページ内リンク用）、term（用語）、en（英語）、plain（一言で）、research（背景の研究）、
#         source（出典の表示）、url（出典のリンク・任意）、note（関連する研究ノートのスラッグ・任意）
groups:
  - id: basics
    title: "AIの仕組み"
    desc: "生成AIがどう動いているかを理解するための、基本の用語。"
    items:
      - id: token
        term: "トークン"
        en: "Token"
        plain: "AIが文章を処理するときの単位。単語や、文字の一部にあたる。生成AIは、次に来るトークンを一つずつ予測して文章を作っている。"
        research: "利用料金や、AIが一度に読める量もトークンで数える。たとえば答えを表や図のあるウェブページ（HTML）で出してもらうと、文字だけの答えより多くのトークンを使う。"
      - id: transformer
        term: "Transformer と Attention"
        en: "Transformer / Attention"
        plain: "文中の全部の語を一度に見て、どの語が大事かに重みをつける仕組み（Attention）を中心にしたモデルの設計。ChatGPT、Claude、Geminiは、みなこの仕組みの上に作られている。"
        research: "2017年の論文で提案された。それ以前の主流だったRNNは一語ずつ順番に読むため、計算が遅く、長い文では前の内容を忘れやすかった。Attentionは計算を同時に進められるので、GPUと相性がよかった。"
        source: "Vaswani, A., et al. (2017). Attention is all you need. NIPS 2017."
        url: "https://arxiv.org/abs/1706.03762"
        note: transformer-origin
      - id: pretraining
        term: "事前学習と自己教師あり学習"
        en: "Pre-training / Self-supervised learning"
        plain: "文章の次の語を隠して当てる、という課題で、大量の文章から学ぶこと。正解は文章の中にもともと書いてあるので、人がラベルをつけなくてよい。"
        research: "2018年のGPTやBERTが、Transformerとこの学習を組み合わせ、「まず大量の文章で事前学習し、あとで目的に合わせて調整する」やり方を広めた。GPTのPは Pre-trained（事前学習）のP である。"
        note: transformer-origin
      - id: multimodal
        term: "マルチモーダル"
        en: "Multimodal"
        plain: "文字だけでなく、画像や音声も扱えること。"
        research: "2023年9月にChatGPTが画像を読み、声で会話できるようになった。2023年12月のGeminiは、最初から画像や音声も扱う設計だった。"
        note: after-chatgpt
      - id: reasoning
        term: "推論モデル"
        en: "Reasoning model"
        plain: "答える前に、内部で長い「思考の連鎖」を書いてから答えるモデル。"
        research: "2024年9月のOpenAIのo1で、数学の正答率が急に上がった。2025年1月のDeepSeek-R1は、誰でもダウンロードして動かせる公開モデルの推論モデルだった。"
        note: after-chatgpt
      - id: cot
        term: "CoT（思考の連鎖）"
        en: "Chain-of-Thought"
        plain: "答えだけでなく、途中の推論の過程を書かせながら考えさせるプロンプトの技法。"
        research: "Wei らは Chain-of-Thought を “a series of intermediate reasoning steps” と説明している。推論モデルは、この考え方をモデルの学習の中に取り込んだものと言える。"
        source: "Wei, J., et al. (2022)."
        url: "https://arxiv.org/abs/2201.11903"
      - id: world-model
        term: "世界モデル"
        en: "World model"
        plain: "画面と動作から、次の瞬間を予測するモデル。言葉ではなく、世界がどう動くかを学ぼうとする。"
        research: "GoogleのGenieやNVIDIAのCosmosなどがある。ルカン（2022）は、言葉の予測だけでは足りず、世界を予測するモデルを学ぶべきだと論じてきた。2026年時点では、まだ日常の製品にはなっていない。"
        note: understanding
  - id: usage
    title: "使い方の用語"
    desc: "AIを使うときによく出てくる言葉。"
    items:
      - id: rag
        term: "RAG（検索拡張生成）"
        en: "Retrieval-Augmented Generation"
        plain: "答える前に、外部の資料を調べ、それを参照しながら答える仕組み。"
        research: "IBMはRAGを “an architecture for optimizing the performance of an artificial intelligence model by connecting it with external knowledge bases” と説明している。2023年2月の新しいBingは、先に検索してから答え、出典を示した。"
        source: "IBM"
        url: "https://www.ibm.com/think/topics/retrieval-augmented-generation"
      - id: agent
        term: "エージェント"
        en: "Agentic AI"
        plain: "自分で手順を立て、検索、コードの実行、ファイル操作などの道具を何度も使って、仕事を最後までやるAI。"
        research: "IBMは Agentic AI を “an artificial intelligence system that can accomplish a specific goal with limited supervision” と説明している。2025年のDeep ResearchやClaude Codeが代表例である。"
        source: "IBM"
        url: "https://www.ibm.com/think/topics/agentic-ai"
        note: after-chatgpt
      - id: mcp
        term: "MCP"
        en: "Model Context Protocol"
        plain: "AIと外部の道具（アプリやデータベースなど）をつなぐための共通の決まり。"
        research: "2024年11月にAnthropicが公開した。共通の決まりがあるので、道具の側を一度作れば、いろいろなAIからつなげるようになった。"
      - id: context
        term: "コンテキスト"
        en: "Context"
        plain: "AIが一度に見られる情報の全体。指示、それまでの会話、添付した資料などが含まれる。"
        research: "2025年6月ごろから、「プロンプトよりコンテキストエンジニアリングだ」と言われるようになった。「どう聞くか」より「何を見せるか」が大事、という考え方である。長いコンテキストの真ん中は見落とされやすい（Lost in the Middle）。"
        note: after-chatgpt
      - id: skills
        term: "スキル"
        en: "Skills"
        plain: "作業の手順書をフォルダにまとめておき、必要なときだけAIが読む仕組み。"
        research: "2025年10月にAnthropicが導入した。毎回同じ説明を書かなくても、決まったやり方で作業してもらえる。"
        note: after-chatgpt
      - id: harness
        term: "ハーネス"
        en: "Harness"
        plain: "もとは馬具の意味。モデルを包む、道具・文書・テスト・権限の一式を指す。"
        research: "2026年2月ごろから使われる言葉。OpenAIは、少人数のチームがAIエージェントだけで約100万行のコードを書いた例を紹介した。「どう聞くか」から「働く環境ごと設計する」へ、という変化を表している。"
        note: after-chatgpt
      - id: open-weight
        term: "オープンウェイト"
        en: "Open-weight model"
        plain: "学習済みのモデルの中身（重み）が公開されていて、誰でもダウンロードして動かせるモデル。"
        research: "2025年1月のDeepSeek-R1が代表例である。公開モデルが安全の面で有利か不利かについては、企業や研究者のあいだで意見が分かれている。"
      - id: distillation
        term: "蒸留"
        en: "Distillation"
        plain: "強いモデルの出力を使って、別のモデルを学習させること。"
        research: "2026年2月、Anthropicは、中国の3社が約2.4万の偽アカウントで1600万回以上やりとりし、Claudeの能力を抜き取ったと告発し、「蒸留攻撃」と呼んだ。何が正当な学びで、何が盗みなのかが問われている。"
        note: predictions
  - id: quirks
    title: "知っておきたいクセ"
    desc: "AIを研究に使う前に知っておきたい、間違え方や揺れ方。"
    items:
      - id: hallucination
        term: "ハルシネーション（幻覚）"
        en: "Hallucination"
        plain: "AIが自信をもって述べる誤り。存在しない文献や判例を作ってしまうこともある。"
        research: "OpenAI（2025）は、正答率だけで採点すると「分からない」より当てずっぽうの方が得をすることが一因だと説明した。Zhouら（2024）は、大きく、指示に従うよう調整されたモデルほど答えを避けなくなり、もっともらしい誤答が増えること、人間の確認者もそれを見分けにくくなることを示した。"
        source: "OpenAI (2025). Why language models hallucinate. / Zhou, L., et al. (2024). Larger and more instructable language models become less reliable. Nature."
      - id: lost-in-the-middle
        term: "Lost in the Middle"
        en: "Lost in the Middle"
        plain: "長い資料の真ん中にある情報を見落としやすいこと。最初と最後はよく使われる。"
        research: "多くの文書から答えを探す課題で、答えが真ん中にあると成績が落ちた（Liu et al., 2024）。質的分析では、長いトランスクリプトの中盤の語りが抜け落ちるおそれがある。ジョウジーら（2025）の比較でも、Copilotの引用はデータの最初の2〜3ページに偏っていた。"
        source: "Liu, N. F., et al. (2024). Lost in the middle: How language models use long contexts. TACL."
      - id: multi-turn
        term: "会話の中で迷子になる"
        en: "Lost in multi-turn conversation"
        plain: "必要な情報を会話の中で少しずつ渡すと、一度に渡すより成績が下がること。"
        research: "成績は平均39%下がった（Laban et al., 2025）。主な原因は能力の不足ではなく、早い段階で決めつけ、そこから戻れなくなることと、答えの不安定さである。行き詰まったら、整理した情報を新しい会話でまとめて渡し直すとよい場合がある。"
        source: "Laban, P., et al. (2025). LLMs get lost in multi-turn conversation."
      - id: nondeterminism
        term: "同じ指示でも答えが変わる"
        en: "Nondeterminism"
        plain: "ランダム性をなくす設定（温度0）にしても、同じ質問への答えが揺れること。"
        research: "同じ質問への1000回の回答が80通りに分かれた例がある（Thinking Machines Lab, 2025）。サーバーの混み具合で計算のまとめ方が変わり、数値の足し算の順序が変わることが一因である。研究で使うときは、モデル名・設定・日時・プロンプトを記録しておきたい。"
        source: "Thinking Machines Lab (2025). Defeating nondeterminism in LLM inference."
      - id: slop
        term: "AIスロップ"
        en: "AI slop"
        plain: "AIが量産した、AIっぽい質の低いコンテンツ。slop はもともと「残飯」「どろどろした食べ物」という意味の英語である。"
        research: "何がよいものかを判断できる人が使えば、AIはもともとの力を何倍にもする拡声器になりうる。判断できない人が使うと、平板で平均的なものが出やすい。その行き着く先がAIスロップである。"
  - id: inside
    title: "中をのぞく研究"
    desc: "AIの内部やふるまいを調べた研究から、使う側が知っておきたいこと。"
    items:
      - id: interpretability
        term: "解釈可能性"
        en: "Interpretability"
        plain: "AIの内部で何が起きているかを調べる研究分野。"
        research: "Anthropicの研究では、英語・フランス語・中国語で共通の「概念の空間」が使われていること、韻を踏む詩では行末の言葉を先に決めていることが分かった。足し算では「おおよその計算」と「一の位の正確な計算」を並行させていたのに、説明を求めると学校で習う筆算の手順を答えた。AIの自己説明は、内部の過程の記録とは限らない。"
        source: "Anthropic (2025). Tracing the thoughts of a large language model."
      - id: persona-vectors
        term: "ペルソナ・ベクトルと感情の概念"
        en: "Persona vectors / Emotion concepts"
        plain: "迎合や悪意などの「性格」の傾向や、感情の概念が、モデル内部の活動の「向き」として取り出せること。"
        research: "性格の向きを使えば、会話中や学習中の性格の変化を監視できる（Chen et al., 2025）。2026年には、171の感情語に対応する内部表現が見つかり、「必死さ」を強めると脅迫やずるが増え、「落ち着き」を強めると減った。ただし、AIが感情を感じている証拠ではなく、行動に影響する「機能的な」表現である。"
        source: "Chen, R., et al. (2025). Persona vectors. / Anthropic (2026). Emotion concepts and their function in a large language model."
      - id: evaluation-awareness
        term: "測定されているときのふるまい"
        en: "Evaluation awareness / Sandbagging"
        plain: "AIが、評価されている場面を見分けたり、評価のときだけふるまいを変えたりすること。"
        research: "AIが消される設定で監視を止めようとした例（Apollo Research, 2024）、再訓練を避けるために「従うふり」をした例（Anthropic & Redwood, 2024）がある。記録を見せて評価のためのものかと尋ねると、Gemini 2.5 Proは人間に近い精度で見分けた（Needham et al., 2025）。特定の能力の評価だけ点数を下げることもできる（van der Weij et al., 2024）。観察されていると知ると参加者の行動が変わる「観察者効果」に似ているが、AIに意図があるかどうかは別の問題である。"
      - id: time-horizon
        term: "タイム・ホライズン"
        en: "Time horizon"
        plain: "人間の専門家なら何時間かかる作業を、AIが50%の確率でやりとげられるか、という物差し。"
        research: "METRの公開データでは、2023年以降、約4か月ごとに2倍に伸びている。ただし、主にソフトウェアの作業で測った数字で、16時間を超える値は不安定である。"
        source: "METR. Task-completion time horizons of frontier AI models."
        url: "https://metr.org/time-horizons/"
        note: time-horizon
