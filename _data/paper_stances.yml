- id: optimistic
  title: "楽観：AIで分析を広げる"
  short: "楽観"
  desc: "生成AIを使えば、質的分析の規模や効率を広げられると考える論考。実践の手引きも含む。"
  title_en: "Optimistic: AI to scale up analysis"
  short_en: "Optimistic"
  desc_en: "Papers holding that generative AI can extend the scale and efficiency of qualitative analysis, including practical guides."
- id: support
  title: "支持：研究者が主導すれば使える"
  short: "支持"
  desc: "全面的な拒否には反対し、研究者が判断と責任をもつかぎり、AIを分析の支援や対話の相手として使えると考える論考。"
  title_en: "Supportive: usable when the researcher leads"
  short_en: "Supportive"
  desc_en: "Papers that oppose a blanket rejection and hold that AI can serve as an analytic aid or dialogue partner, as long as researchers keep judgment and responsibility."
- id: cautious
  title: "慎重：リスクを見きわめながら"
  short: "慎重"
  desc: "使うこと自体は否定しないが、解釈の浅さ、透明性、倫理、データの信頼性などのリスクを重く見る論考。指針やチェックリストも含む。"
  title_en: "Cautious: weighing the risks"
  short_en: "Cautious"
  desc_en: "Papers that do not reject use as such but weigh heavily the risks: shallow interpretation, transparency, ethics, data reliability. Includes guidelines and checklists."
- id: against
  title: "反対：使うべきではない"
  short: "反対"
  desc: "少なくとも分析の中心では、生成AIを使うべきではないとする論考と、雑誌の方針。"
  title_en: "Against: should not be used"
  short_en: "Against"
  desc_en: "Papers, and journal policies, holding that generative AI should not be used, at least at the core of analysis."
- id: comparison
  title: "実証：AIと人間の分析を比べた研究"
  short: "実証（比較研究）"
  desc: "同じデータをAIと人間で分析し、結果を比べた研究。結果は研究によってかなり違う。"
  title_en: "Empirical: studies comparing AI and human analysis"
  short_en: "Empirical (comparisons)"
  desc_en: "Studies that analyzed the same data with AI and with humans and compared the results. Findings vary considerably between studies."
