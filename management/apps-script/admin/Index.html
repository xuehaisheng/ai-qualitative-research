async function api(url,options={}){
  if(gasMode){const result=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Google 服务连接中断，请重试'))).adminApi({url,method:options.method||'GET',body:options.body||''}));if(!result.ok)throw new Error(result.error);return result.data;}
  const response=await fetch(url,{...options,headers:{...(options.body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{}),...options.headers}});let result;try{result=await response.json();}catch{throw new Error('服务没有返回有效响应，请检查后台连接');}if(!response.ok){if(response.status===401&&url!=='/api/login')showLogin();throw Object.assign(new Error(result.error||'操作没有完成'),{status:response.status});}return result;
}
function showLogin(){if(gasMode){$('#shell').hidden=true;$('#login').hidden=false;$('#login').innerHTML='<div class="login-card"><p class="eyebrow">GOOGLE WORKSPACE</p><h1>请重新打开后台。</h1><p>使用部署本项目的 Google 账号访问；后台权限为“仅自己”。</p><button class="button primary" id="google-reload">重新连接</button></div>';$('#google-reload').onclick=()=>location.reload();return;}$('#shell').hidden=true;$('#login').hidden=false;$('#login input').focus();}
async function refreshOverview(){overview=await api('/api/overview');for(const[k,n]of Object.entries(overview.counts))$(`[data-count="${k}"]`).textContent=n;$('#pending-count').textContent=overview.pending.length||'';}
async function confirmAction(title,description){const d=$('#confirm');$('#confirm-title').textContent=title;$('#confirm-description').textContent=description;d.showModal();return new Promise(resolve=>d.addEventListener('close',()=>resolve(d.returnValue==='confirm'),{once:true}));}
function heading(eyebrow,title,subtitle,actions=''){return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions}</div></div>`;}
function period(){return `<select class="period" aria-label="统计时间范围">${[7,30,90].map(n=>`<option value="${n}" ${days===n?'selected':''}>过去 ${n} 天</option>`).join('')}</select>`;}
const title=r=>r.meta?.title||r.title?.ja||r.name?.ja||r.id;
const badge=r=>`<span class="badge ${r.deleted?'deleted':r.draft?'draft':''}">${r.deleted?'待归档':r.draft?'草稿待发布':'已发表'}</span>`;
function metric(label,value,note){return `<div class="metric"><span class="metric-label">${label}</span><strong class="metric-value">${value}</strong><span class="metric-note">${note}</span></div>`;}
function metrics(report){const t=report.total,empty=!t.views;return `<div class="metrics">${metric('访问量',empty?'—':number(t.views),'页面被打开的次数')}${metric('访客数',empty?'—':number(t.visitors),'按匿名浏览器标识去重')}${metric('有效阅读',empty?'—':number(t.reads),'笔记活跃 ≥30 秒且读到 ≥50%')}${metric('回访比例',empty?'—':t.returnRate+'%','本期有两个及以上会话的访客')}</div>`;}
function trend(report){const max=Math.max(1,...report.trend.map(x=>x.views)),line=key=>report.trend.map((v,i)=>`${i/(report.trend.length-1)*600},${190-v[key]/max*175}`).join(' ');return `<div class="panel"><div class="panel-head"><div><h2>阅读的轨迹</h2><p class="subtitle">每天的访问与独立访客 · 日本时间</p></div><div class="legend"><span>访问量</span><span>访客数</span></div></div><div class="chart">${report.total.views?`<svg viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="每日访问量和访客数趋势"><polyline points="${line('visitors')}" fill="none" stroke="#a5ad9c" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="${line('views')}" fill="none" stroke="#343a2e" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`:'<div class="chart-empty"><strong>还没有访问记录</strong><span>统计服务上线后，真实阅读会从这里开始。</span></div>'}</div><div class="chart-foot"><span>${report.start}</span><span>${report.end}</span></div></div>`;}
function ranking(name,items){const max=Math.max(1,...items.map(x=>x.views));return `<section class="panel"><div class="panel-head"><h2>${name}</h2></div><div class="panel-body"><ul class="rank">${items.length?items.map(x=>`<li><div class="rank-row"><span>${esc(x.label)}</span><span>${number(x.views)}</span></div><div class="rank-track"><svg viewBox="0 0 100 3" preserveAspectRatio="none" aria-hidden="true"><rect width="${x.views/max*100}" height="3" fill="#8e9982"/></svg></div></li>`).join(''):'<li class="empty-small">收到访问记录后显示</li>'}</ul></div></section>`;}
function pagesTable(report){return `<section class="panel"><div class="panel-head"><div><h2>读者在哪里停留</h2><p class="subtitle">按页面访问量排序，最多展示 20 个页面</p></div><a class="button quiet" href="/api/stats.csv?days=${days}">导出 CSV ↗</a></div><div class="table-scroll"><table><thead><tr><th>页面</th><th>访问量</th><th>访客</th><th>有效阅读</th><th>活跃时间</th></tr></thead><tbody>${report.pages.length?report.pages.map(r=>`<tr><td class="row-path">${esc(r.path)}</td><td>${number(r.views)}</td><td>${number(r.visitors)}</td><td>${number(r.reads)}</td><td>${number(r.seconds)} 秒</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty"><h2>等待第一位读者。</h2><p>这里会呈现真实的页面阅读记录。管理员自己的后台浏览不计入统计。</p></div></td></tr>'}</tbody></table></div></section>`;}
async function dashboard(analytics=false){const report=await api('/api/stats?days='+days);main.innerHTML=heading(analytics?'READERS & READING':'EDITORIAL OVERVIEW',analytics?'读者与阅读。':'内容与读者。',analytics?'了解内容如何被发现，又在哪里被认真阅读。':'留下一点想法，继续一场讨论。',period()+(analytics?'<a class="button" href="/api/stats.csv?days='+days+'">导出统计 ↗</a>':'<a class="button primary" href="#notes/new">＋ 写一篇笔记</a>'))+metrics(report)+(analytics?trend(report):`<div class="dashboard-grid">${trend(report)}<section class="panel"><div class="draft-summary"><p class="eyebrow">ON YOUR DESK</p><h2>待发布的内容</h2><span class="number">${overview.pending.length.toString().padStart(2,'0')}</span><p>${overview.pending.length?'草稿已保存，准备好后再发布。':'桌面很整洁，随时可以开始下一篇。'}</p><a class="button" href="#publish">查看发布清单 ↗</a></div><div class="panel-body"><h3>最近的工作</h3>${activity(overview.audit.slice(0,3))}</div></section></div><div class="shortcut-grid">${Object.keys(descriptions).map((k,i)=>`<a class="shortcut" href="#${k}"><span class="eyebrow">0${i+1} / ${k}</span><strong>${labels[k]} <span aria-hidden="true">↗</span></strong><small>${overview.counts[k]} 条内容 · 进入管理</small></a>`).join('')}</div>`)+pagesTable(report)+(analytics?`<div class="split-panels">${ranking('访问从哪里来',report.sources)}${ranking('设备',report.devices)}${ranking('阅读语言',report.languages)}</div><p class="fine section-gap">${report.first?'最早记录：'+report.first:'尚未开始收到数据'} · 保留最近 180 天 · 不记录 IP、URL 查询参数或个人身份信息。访客按浏览器标识计算，不能等同于真实人数；拦截统计和关闭存储会影响计数。</p>`:'');}
function activity(items){const verbs={save:'保存草稿',archive:'加入归档清单',discard:'撤回草稿',publish:'发布内容',upload:'上传文件'};return `<ul class="activity">${items.length?items.map(x=>`<li>${verbs[x.action]||esc(x.action)}${x.item_id?' · '+esc(x.item_id):''}<span class="when">${date(x.created)}</span></li>`).join(''):'<li class="empty-small">开始编辑后，这里会留下工作记录。</li>'}</ul>`;}
async function listing(k){records=await api('/api/content/'+k);main.innerHTML=heading('CONTENT / '+k.toUpperCase(),labels[k],descriptions[k],`<a class="button primary" href="#${k}/new">＋ 新建${k==='notes'?'笔记':labels[k]}</a>`)+`<div class="toolbar"><div class="toolbar-left"><label class="search"><input id="search" type="search" placeholder="搜索标题、内容或地址…" aria-label="搜索${labels[k]}"></label><select id="filter" class="filter-select" aria-label="筛选状态"><option value="all">全部状态</option><option value="draft">待发布</option><option value="published">已发表</option><option value="deleted">待归档</option></select></div><span id="list-count" class="small-counter"></span></div><div class="panel table-scroll"><table><thead><tr><th>${k==='members'?'成员':'标题'}</th><th>${k==='events'?'日期 / 活动状态':k==='members'?'角色':'分类'}</th><th>发布状态</th><th>语言</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;renderRows(k);$('#search').addEventListener('input',()=>renderRows(k));$('#filter').addEventListener('change',()=>renderRows(k));}
function renderRows(k){const q=$('#search').value.toLowerCase(),filter=$('#filter').value;const list=records.filter(r=>(filter==='all'||filter==='draft'&&r.draft&&!r.deleted||filter==='published'&&!r.draft||filter==='deleted'&&r.deleted)&&JSON.stringify(r).toLowerCase().includes(q));$('#list-count').textContent=list.length+' 条内容';$('#rows').innerHTML=list.length?list.map(r=>`<tr><td class="row-title"><a href="#${k}/${encodeURIComponent(r.id)}"><strong>${esc(title(r))}</strong><small>${esc(r.meta?.title_en||r.meta?.en||r.title?.en||r.name?.en||r.id)}</small></a></td><td>${esc(k==='events'?r.date+' / '+(r.status==='upcoming'?'即将举行':'过去记录'):k==='members'?r.role.ja:r.meta.topic||r.meta.category||'—')}</td><td>${badge(r)}</td><td>${(r.meta?.title_en||r.meta?.en||r.title?.en||r.name?.en)?'JA / EN':'JA'}</td><td><a class="button quiet" href="#${k}/${encodeURIComponent(r.id)}">编辑 ↗</a></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty"><h2>这里还没有内容</h2><p>试试其他搜索词，或新建第一条记录。</p></div></td></tr>';}
const emptyBi=()=>({ja:'',en:''});
function newRecord(k){if(k==='notes'||k==='knowledge')return {kind:k,id:null,revision:null,meta:{title:'',...(k==='notes'?{date:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'}),title_en:'',summary_ja:'',summary_en:'',author:'薛海升',topic:'',wiki:[],related_notes:[]}:{en:'',summary:'',summary_en:'',category:'basics',related:[],articles:[],order:0}),key:''},bodyJa:'',bodyEn:''};if(k==='members')return {kind:k,id:null,revision:null,name:emptyBi(),role:{ja:'共同研究者',en:'Co-researcher'},affiliation:emptyBi(),bio:emptyBi(),profile_url:'',order:overview.counts.members};return {kind:k,id:null,revision:null,title:emptyBi(),date:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'}),status:'upcoming',place:emptyBi(),summary:emptyBi(),links:[]};}
const field=(label,name,value,options={})=>`<label class="field"><span>${label}</span>${options.textarea?`<textarea data-field="${name}" rows="${options.rows||3}">${esc(value)}</textarea>`:options.select?`<select data-field="${name}">${options.select.map(([v,t])=>`<option value="${esc(v)}" ${String(value)===v?'selected':''}>${t}</option>`).join('')}</select>`:`<input data-field="${name}" type="${options.type||'text'}" value="${esc(value)}" ${options.readonly?'readonly':''} ${options.placeholder?'placeholder="'+esc(options.placeholder)+'"':''}>`}${options.help?`<small>${options.help}</small>`:''}</label>`;
function get(object,path){return path.split('.').reduce((v,k)=>v?.[k],object);}
function set(object,path,value){const keys=path.split('.');let o=object;keys.slice(0,-1).forEach(k=>{o[k]??={};o=o[k];});o[keys.at(-1)]=value;}
function readForm(){if(!current)return;let record=structuredClone(current);const advanced=$('#advanced-meta');if(advanced){try{record.meta=JSON.parse(advanced.value);}catch{throw new Error('扩展字段 JSON 格式无效');}}for(const el of main.querySelectorAll('[data-field]')){let value=el.value;if(el.dataset.field==='meta.date'&&String(current.meta?.date||'').slice(0,10)===value)value=current.meta.date;if(el.dataset.array!==undefined)value=value.split(',').map(x=>x.trim()).filter(Boolean);if(el.type==='number')value=Number(value);set(record,el.dataset.field,value);}current=record;}
function biFields(label,key,record,textarea=false){return `<div class="field-pair">${field(label+' · JA',key+'.ja',get(record,key+'.ja'),{textarea})}${field(label+' · EN',key+'.en',get(record,key+'.en'),{textarea})}</div>`;}
function arrayField(label,key,value){return `<label class="field"><span>${label}</span><input data-field="meta.${key}" data-array value="${esc((value||[]).join(', '))}"><small>填地址标识，用英文逗号分隔。</small></label>`;}
async function edit(k,id){current=id==='new'?newRecord(k):await api(`/api/content/${k}/${id}`);editorLanguage='ja';preview=false;dirty=false;renderEditor();}
function renderEditor(){const r=current,k=r.kind,text=k==='notes'||k==='knowledge';main.innerHTML=`<div class="editor-top"><div><a class="back-link" href="#${k}">← 返回${labels[k]}</a><h1 class="editor-title">${r.id?'编辑':'新建'}${k==='notes'?'研究笔记':labels[k]}</h1><span class="save-status ${dirty?'dirty':''}">${dirty?'有尚未保存的修改':r.draft?'草稿已保存，尚未发布':r.id?'正在编辑已发表的内容':'新内容会先存入草稿'}</span></div><div class="actions">${r.draft?'<button class="button quiet" data-action="discard">撤回草稿</button>':''}${r.id?'<button class="button quiet danger" data-action="archive">归档</button>':''}<button class="button primary" data-action="save">保存草稿 ↑</button></div></div>${r.deleted?'<div class="notice warn">这条内容已加入归档清单，正式发布后才会从网站移除。保存草稿可以恢复它。</div>':''}<div class="editor-grid"><div class="editor-main">${text?textEditor(r):structuredEditor(r)}</div><aside class="editor-side">${text?textSettings(r):structuredSettings(r)}<div class="form-section"><p class="eyebrow">WORKFLOW</p><h2>写好，再发表。</h2><p class="editor-help">保存只更新后台草稿。请到“待发布”核对改动后，再统一发布到网站。</p><a class="button" href="#publish">查看待发布内容 ↗</a></div></aside></div>`;if(text&&preview)renderPreview();}
function textEditor(r){const note=r.kind==='notes',m=r.meta;return `<section class="form-section"><h2><span class="section-number">01</span>标题与摘要</h2>${field('日文标题','meta.title',m.title)}${field('英文标题',note?'meta.title_en':'meta.en',note?m.title_en:m.en)}<div class="field-pair">${field('日文摘要',note?'meta.summary_ja':'meta.summary',note?m.summary_ja:m.summary,{textarea:true})}${field('英文摘要','meta.summary_en',m.summary_en,{textarea:true})}</div></section><section class="panel"><div class="language-tabs" role="tablist" aria-label="正文语言"><button role="tab" data-language="ja" aria-selected="${editorLanguage==='ja'}">日本語</button><button role="tab" data-language="en" aria-selected="${editorLanguage==='en'}">English${r.bodyEn.trim()?'':' · 未填写'}</button><button class="preview-toggle" data-action="preview">${preview?'继续编辑':'阅读预览 ↗'}</button></div>${preview?'<div id="preview" class="preview-body">正在生成预览…</div>':`<div class="edit-toolbar" aria-label="Markdown 工具"><button data-insert="heading" title="二级标题">H₂</button><button data-insert="bold" title="加粗"><b>B</b></button><button data-insert="italic" title="斜体"><i>I</i></button><button data-insert="quote" title="引用">“ ”</button><button data-insert="link" title="链接">链接</button><button data-insert="list" title="列表">≡</button><button data-action="upload">配图 / PDF ＋</button><input id="file-upload" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf" hidden></div><textarea id="body-editor" class="body-editor" data-field="${editorLanguage==='ja'?'bodyJa':'bodyEn'}" aria-label="${editorLanguage==='ja'?'日文':'英文'}正文" spellcheck="false" placeholder="从一个想法开始。支持 Markdown，也保留已有 HTML 与模板。">${esc(editorLanguage==='ja'?r.bodyJa:r.bodyEn)}</textarea>`}<div class="editor-caption"><span>Markdown · 保留现有引文、HTML 与模板</span><span id="word-count">${number((editorLanguage==='ja'?r.bodyJa:r.bodyEn).length)} 字符</span></div></section>`;}
function textSettings(r){const note=r.kind==='notes',m=r.meta;return `<section class="form-section"><h2><span class="section-number">02</span>发布信息</h2>${field('地址标识','meta.key',m.key,{readonly:!!r.id,placeholder:'例如 ai-and-fieldwork',help:'已有文章的地址保持不变。'})}${note?field('日期','meta.date',String(m.date||'').slice(0,10),{type:'date'})+field('作者','meta.author',m.author)+field('主题','meta.topic',m.topic):field('分类标识','meta.category',m.category,{help:'沿用现有分类，例如 basics、tools。'})}${!note?field('排列顺序','meta.order',m.order||0,{type:'number'}):''}</section><section class="form-section"><h2><span class="section-number">03</span>关联内容</h2>${note?arrayField('关联知识点','wiki',m.wiki)+arrayField('相关阅读笔记','related_notes',m.related_notes):arrayField('关联知识点','related',m.related)+arrayField('研究笔记','articles',m.articles)}<details class="details"><summary>保留的扩展字段</summary><p class="fine">未展示的原始字段也会保存。通常无需修改。</p><textarea id="advanced-meta" aria-label="扩展字段 JSON">${esc(JSON.stringify(m,null,2))}</textarea></details></section>`;}
function structuredEditor(r){if(r.kind==='members')return `<section class="form-section"><h2><span class="section-number">01</span>成员介绍</h2>${biFields('姓名','name',r)}${biFields('角色','role',r)}${biFields('所属','affiliation',r,true)}${biFields('个人介绍','bio',r,true)}</section>`;return `<section class="form-section"><h2><span class="section-number">01</span>活动内容</h2>${biFields('标题','title',r)}${biFields('地点 / 主办','place',r,true)}${biFields('活动简介','summary',r,true)}</section><section class="form-section"><h2><span class="section-number">02</span>相关资料与报名</h2>${r.links.map((l,i)=>`<div class="link-item">${biFields('链接文字',`links.${i}.label`,r)}${field('链接地址',`links.${i}.url`,l.url,{placeholder:'https:// 或 /articles/…'})}<div class="actions"><button class="button quiet danger" data-remove-link="${i}">移除链接</button></div></div>`).join('')}<button class="button" data-action="add-link">＋ 添加链接</button></section>`;}
function structuredSettings(r){return `<section class="form-section"><h2><span class="section-number">03</span>${r.kind==='members'?'展示设置':'日期与状态'}</h2>${r.kind==='members'?field('researchmap / 个人主页','profile_url',r.profile_url,{type:'url'})+field('排列顺序','order',r.order,{type:'number',help:'数字越小，排序越靠前。'}):field('活动日期','date',r.date,{help:'支持 YYYY-MM-DD 或仅 YYYY-MM。'})+field('展示分组','status',r.status,{select:[['upcoming','即将举行'],['past','过去记录']]})}</section>`;}
async function renderPreview(){const r=await api('/api/preview',{method:'POST',body:JSON.stringify({body:editorLanguage==='ja'?current.bodyJa:current.bodyEn})});if(!$('#preview'))return;const safe=gasMode?DOMPurify.sanitize(r.html,{ADD_TAGS:['figure','figcaption','details','summary'],ADD_ATTR:['target','rel']}):r.html;$('#preview').innerHTML=(r.hasTemplates?'<div class="notice warn">这段内容包含 Jekyll 模板，配图与模板的最终效果以网站构建结果为准。</div>':'')+safe;}
async function save(){readForm();const r=current;let id=r.id;if(!id){if(r.meta)id=(r.kind==='notes'?String(r.meta.date).slice(0,10)+'-':'')+r.meta.key;else id=(r.kind==='events'?'event-':'member-')+crypto.randomUUID().slice(0,8);}const result=await api(`/api/content/${r.kind}/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify({record:r,revision:r.revision||null})});current=result;dirty=false;lastHash='#'+r.kind+'/'+id;history.replaceState(null,'',lastHash);await refreshOverview();renderEditor();toast('草稿已保存，网站内容尚未改变。');}
async function publishPage(){const changes=await api('/api/changes');main.innerHTML=heading('REVIEW & PUBLISH','准备与读者见面。','核对这些改动，确认后统一发布。',`<a class="button" href="/api/backup">备份草稿 ↓</a>`)+(!session.publishEnabled?'<div class="notice warn"><strong>发布连接尚未开启。</strong> 当前可以完整编辑、保存和预览；草稿不会自动出现在公开网站上。连接 GitHub 发布副本后，即可从这里正式发布。</div>':'<div class="notice">发布会生成一个 Git 提交并推送到 main。GitHub Pages 构建成功后，公开网站才会更新。</div>')+`<section class="panel"><div class="panel-head"><div><h2>这次的改动</h2><p class="subtitle">${overview.pending.length} 条草稿 · ${changes.files.length} 个内容文件 · ${changes.media.length} 个待发布附件</p></div></div><div class="table-scroll"><table><thead><tr><th>内容文件</th><th>操作</th><th>大小</th></tr></thead><tbody>${changes.files.map(f=>`<tr><td class="row-path">${esc(f.file)}</td><td><span class="badge ${f.action==='删除'?'deleted':'draft'}">${f.action}</span></td><td>${number(f.bytes)} B</td></tr>`).join('')||'<tr><td colspan="3"><div class="empty"><h2>暂时没有待发布的改动</h2><p>保存草稿后，改动会在这里列出。</p><a class="button" href="#notes">开始写作 ↗</a></div></td></tr>'}</tbody></table></div>${changes.files.length?`<div class="panel-body">${field('发布备注','publish-message','Update research notes, knowledge and project information')}<div class="actions"><button class="button primary" data-action="publish" ${!session.publishEnabled?'disabled':''}>确认并发布 ↑</button><span class="fine">发布前请核对日文、英文及相关链接。</span></div></div>`:''}</section><section class="panel section-gap"><div class="panel-head"><h2>草稿清单</h2></div><div class="panel-body"><ul class="activity">${overview.pending.map(d=>`<li><a href="#${d.kind}/${encodeURIComponent(d.id)}">${labels[d.kind]} / ${esc(d.id)} ↗</a><span class="when">${d.deleted?'待归档 · ':''}${date(d.updated)}</span></li>`).join('')||'<li class="empty-small">没有待发布的草稿。</li>'}</ul></div></section>`;}
function settingsPage(){if(gasMode){googleSettingsPage();return;}main.innerHTML=heading('WORKSPACE SETTINGS','连接与设置。','后台与前台分开运行，共用同一份内容。')+`<div class="editor-grid"><section class="panel"><div class="panel-head"><h2>连接状态</h2></div><div class="panel-body"><div class="setting-row"><span>公开网站</span><code>${esc(session.siteUrl)}</code></div><div class="setting-row"><span>内容存储</span><strong>Git 仓库 + 本地持久化草稿</strong></div><div class="setting-row"><span>统计数据</span><strong>服务端 SQLite · 保留最近 180 天</strong></div><div class="setting-row"><span>发布</span><strong>${session.publishEnabled?'GitHub 连接已开启':'尚未开启'}</strong></div><div class="setting-row"><span>统计接收地址</span><code>${esc(session.trackingUrl||'部署后台并配置 PUBLIC_URL 后显示')}</code></div><p class="fine section-gap">前台需在 _data/analytics.json 配置接收地址后才能开始统计。遵循浏览器的“不跟踪”设置，不收集后台访问、IP 或完整来源网址。</p><a class="button" href="/api/backup">下载草稿备份 ↓</a></div></section><section class="form-section"><p class="eyebrow">ACCESS</p><h2>登录与数据</h2><p class="editor-help">每次登录有效期为 8 小时。密码只在服务器保存加盐哈希。正式部署需 HTTPS，并为 .admin-data 设置持久化磁盘及备份。</p><p class="editor-help">详细启动、发布权限、统计口径和备份步骤见仓库 management/README.md。</p></section></div><section class="panel section-gap"><div class="panel-head"><h2>操作记录</h2></div><div class="panel-body">${activity(overview.audit)}</div></section>`;}
async function route(){const version=++generation;const next=location.hash||'#dashboard';if(dirty&&lastHash!==next){if(!await confirmAction('离开编辑页面？','还有未保存的修改。离开后这些修改会丢失，已保存的草稿会保留。')){history.replaceState(null,'',lastHash);return;}dirty=false;}lastHash=next;const[k,id]=next.slice(1).split('/');const page=labels[k]?k:'dashboard';$('#breadcrumb').textContent='工作台 / '+labels[page];for(const a of document.querySelectorAll('[data-page]')){if(a.dataset.page===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');}$('.sidebar').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');main.innerHTML='<p class="muted">正在载入…</p>';try{await refreshOverview();if(version!==generation)return;current=null;if(['notes','knowledge','events','members'].includes(page)){if(id)await edit(page,decodeURIComponent(id));else await listing(page);}else if(page==='publish')await publishPage();else if(page==='settings')settingsPage();else await dashboard(page==='analytics');}catch(e){if(e.status!==401)main.innerHTML=`<div class="notice warn" role="alert">${esc(e.message)}</div><button class="button" data-action="retry">重新载入</button>`;}}
main.addEventListener('input',e=>{if(current){dirty=true;const s=$('.save-status');if(s){s.textContent='有尚未保存的修改';s.classList.add('dirty');}if(e.target.id==='body-editor')$('#word-count').textContent=number(e.target.value.length)+' 字符';}});
main.addEventListener('change',async e=>{if(e.target.classList.contains('period')){days=Number(e.target.value);await dashboard(kind()==='analytics');}if(e.target.id==='file-upload'&&e.target.files.length){try{const file=e.target.files[0];if(file.size>10*1024*1024)throw new Error('文件需小于 10MB');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});const result=await api('/api/media',{method:'POST',body:JSON.stringify({name:file.name,base64:data})});const text=file.type==='application/pdf'?`[${file.name}]({{ '${result.path}' | relative_url }})`:`![请填写图片说明]({{ '${result.path}' | relative_url }})`;insert(text);toast('附件已保存，正式发布时会与内容一起上传。');}catch(e){toast(e.message,true);}}});
function insert(before,after=''){const area=$('#body-editor');if(!area)return;const start=area.selectionStart,end=area.selectionEnd,selection=area.value.slice(start,end);area.setRangeText(before+selection+after,start,end,'end');area.focus();area.dispatchEvent(new Event('input',{bubbles:true}));}
main.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;try{if(button.dataset.language){readForm();editorLanguage=button.dataset.language;renderEditor();return;}if(button.dataset.insert){const pair={heading:['\n## ','\n'],bold:['**','**'],italic:['*','*'],quote:['\n> ','\n'],link:['[','](https://)'],list:['\n- ','\n']}[button.dataset.insert];insert(...pair);return;}if(button.dataset.removeLink!==undefined){readForm();current.links.splice(Number(button.dataset.removeLink),1);dirty=true;renderEditor();return;}const action=button.dataset.action;if(!action)return;if(action==='google-setup'){button.disabled=true;await api('/api/setup',{method:'POST',body:'{}'});session=await api('/api/session');await refreshOverview();googleSettingsPage();toast('Drive 草稿空间与统计表已创建。');return;}if(action==='google-settings'){button.disabled=true;const form=$('#google-settings');session=await api('/api/settings',{method:'POST',body:JSON.stringify({githubToken:form.elements.githubToken.value.trim(),collectorUrl:form.elements.collectorUrl.value.trim()})});form.reset();await refreshOverview();googleSettingsPage();toast('连接设置已保存。');return;}if(action==='publish-status'){const result=await api('/api/publish-status');toast(result?(result.conclusion==='success'?'网站已构建完成':result.conclusion?'构建状态：'+result.conclusion:'正在等待网站构建'):'还没有发布记录');return;}if(action==='save'){button.disabled=true;await save();}else if(action==='preview'){readForm();preview=!preview;renderEditor();}else if(action==='upload')$('#file-upload').click();else if(action==='add-link'){readForm();current.links.push({label:emptyBi(),url:''});dirty=true;renderEditor();}else if(action==='archive'){if(await confirmAction('将这条内容归档？','发布后会从网站移除。发布前可以撤回草稿恢复原内容。')){await api(`/api/content/${current.kind}/${current.id}`,{method:'DELETE',body:JSON.stringify({revision:current.revision})});dirty=false;location.hash=current.kind;toast('已加入归档清单，尚未改变网站。');}}else if(action==='discard'){if(await confirmAction('撤回这份草稿？','未发布的改动会被移除，已发表的原始内容保持不变。')){await api(`/api/content/${current.kind}/${current.id}`,{method:'POST',body:JSON.stringify({revision:current.revision})});dirty=false;location.hash=current.kind;toast('草稿已撤回。');}}else if(action==='publish'){if(await confirmAction('发布清单中的全部改动？','内容和待发布附件会推送到 GitHub，触发网站重新构建。')){button.disabled=true;button.textContent='正在发布…';const result=await api('/api/publish',{method:'POST',body:JSON.stringify({message:main.querySelector('[data-field="publish-message"]').value})});await refreshOverview();await publishPage();main.insertAdjacentHTML('afterbegin',`<div class="publish-result">已推送提交 ${esc(result.sha.slice(0,8))}。<a href="${esc(result.url)}" target="_blank" rel="noopener">查看网站构建状态 ↗</a>${result.warning?'<p>'+esc(result.warning)+'</p>':''}${gasMode?'<button class="button" data-action="publish-status">刷新上线状态</button>':''}</div>`);toast('已推送 GitHub，等待网站构建。');}}else if(action==='retry')await route();}catch(err){toast(err.message,true);}finally{if(button.isConnected)button.disabled=false;}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&current){e.preventDefault();save().catch(e=>toast(e.message,true));}});
window.addEventListener('hashchange',()=>route());
$('#mobile-menu').addEventListener('click',()=>{const open=$('.sidebar').classList.toggle('open');$('#mobile-menu').setAttribute('aria-expanded',String(open));});
$('#logout').addEventListener('click',async()=>{if(dirty&&!await confirmAction('退出前保存了吗？','未保存的修改会丢失，已保存的草稿会保留。'))return;await api('/api/logout',{method:'POST',body:'{}'});dirty=false;showLogin();});
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;$('#login-error').textContent='';try{const data=await api('/api/login',{method:'POST',body:JSON.stringify({password:e.target.password.value})});csrf=data.csrf;e.target.reset();await start();}catch(err){$('#login-error').textContent=err.message;}finally{button.disabled=false;}});
async function start(){session=await api('/api/session');csrf=session.csrf||'';$('#login').hidden=true;$('#shell').hidden=false;$('#visit-site').href=session.siteUrl;$('.connection').innerHTML='<i></i>'+ (gasMode?'Google Apps Script':session.trackingUrl?'服务已连接':'本地工作空间');if(gasMode&&(!session.configured||!session.githubConnected)){history.replaceState(null,'','#settings');}await route();}
start().catch(e=>{showLogin();if(gasMode)toast(e.message,true);});

function googleSettingsPage(){
 main.innerHTML=heading('GOOGLE APPS SCRIPT','连接你的编辑室。','Google 保存草稿，GitHub 发布文章，Sheets 记录阅读。')+
 `<div class="editor-grid"><div class="editor-main"><section class="form-section"><h2><span class="section-number">01</span>Google 工作空间</h2><p class="editor-help">只需初始化一次。系统会在你的 Drive 创建独立草稿文件夹，并新建一份访问统计表。</p>${session.configured?`<div class="setting-row"><span>草稿空间</span><a href="https://drive.google.com/drive/folders/${esc(session.folderId)}" target="_blank" rel="noopener">打开 Drive ↗</a></div><div class="setting-row"><span>统计表标识</span><code>${esc(session.statsSheetId)}</code></div><p class="fine">把这个表标识填到独立统计项目的 STATS_SHEET_ID 脚本属性。</p>`:'<button class="button primary" data-action="google-setup">初始化工作空间 ↗</button>'}</section><section class="form-section"><h2><span class="section-number">02</span>GitHub 与统计连接</h2><form id="google-settings"><label class="field"><span>GitHub 仓库令牌</span><input name="githubToken" type="password" autocomplete="off" placeholder="${session.githubConnected?'已连接；留空保留现有凭据':'github_pat_…'}"><small>仅授权 ai-qualitative-research 仓库的 Contents 读写和 Actions 读取。只保存到私有管理项目的脚本属性，不回显。</small></label><label class="field"><span>公开统计接收地址</span><input name="collectorUrl" type="url" value="${esc(session.trackingUrl||'')}" placeholder="https://script.google.com/macros/s/…/exec"><small>这里填写独立统计项目部署后的 /exec 地址。</small></label><button type="button" class="button primary" data-action="google-settings">保存连接</button></form></section><section class="form-section"><h2><span class="section-number">03</span>接入公开网站</h2><p class="editor-help">将统计地址填入仓库 _data/analytics.json 的 endpoint 并发布，前台才会开始发送记录。已有文章、活动和成员的数据改造应先合并到 main。</p><p class="fine">统计项目只能写入统计表，不含 GitHub 令牌或文章编辑接口。无历史数据时 dashboard 保持空状态。</p></section></div><aside class="editor-side"><section class="form-section"><p class="eyebrow">ACCESS & STORAGE</p><h2>你的 Google 账号，就是后台登录。</h2><p class="editor-help">管理项目应以你的身份执行，访问范围为“仅自己”。草稿保存到 Drive；已发布内容以 GitHub 的当前文件为准。退出会锁定当前页面，不退出整个 Google 账号。</p><p class="editor-help">重新发布前会核对原文版本。文章地址不变；外部修改会触发冲突提示。</p>${session.configured?'<a class="button" href="/api/backup">备份草稿 ↓</a>':''}</section></aside></div>`;
 $('#google-settings').addEventListener('submit',e=>e.preventDefault());
}
// Apps Script is sandboxed in an iframe: handle internal navigation and downloads locally.
document.addEventListener('click',async e=>{if(!gasMode)return;const anchor=e.target.closest('a');if(!anchor)return;const href=anchor.getAttribute('href')||'';if(href.startsWith('#')){e.preventDefault();if(location.hash===href)await route();else location.hash=href;return;}if(href.startsWith('/api/')){e.preventDefault();try{const file=await api(href),url=URL.createObjectURL(new Blob([file.text],{type:file.mime})),link=document.createElement('a');link.href=url;link.download=file.filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(error){toast(error.message,true);}}});
</script></body></html>
