<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="AIのこの先をめぐる五つの見方" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title>AIのこの先をめぐる五つの見方</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="880" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="160" height="290" rx="8" fill="#f4f2ee" stroke="none" stroke-width="1" />
<text x="100" y="56" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700" >サットン</text>
<text x="100" y="108" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2019</text>
<text x="100" y="150" font-size="17" fill="#2f5fb3" text-anchor="middle" font-weight="700" >「苦い教訓」</text>
<text x="100" y="196" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >計算資源を使い続け</text>
<text x="100" y="220" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >られる一般的な方法</text>
<text x="100" y="244" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >が、最後に勝つ</text>
<rect x="192" y="20" width="160" height="290" rx="8" fill="#eef2fa" stroke="none" stroke-width="1" />
<text x="272" y="56" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700" >シルバー＆</text>
<text x="272" y="78" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700" >サットン</text>
<text x="272" y="108" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2025</text>
<text x="272" y="150" font-size="17" fill="#2f5fb3" text-anchor="middle" font-weight="700" >「経験の時代」</text>
<text x="272" y="196" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >人間のデータより、</text>
<text x="272" y="220" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >自ら行動して得る</text>
<text x="272" y="244" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >経験で伸びる</text>
<rect x="364" y="20" width="160" height="290" rx="8" fill="#f4f2ee" stroke="none" stroke-width="1" />
<text x="444" y="56" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700" >ルカン</text>
<text x="444" y="108" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2022</text>
<text x="444" y="150" font-size="17" fill="#2f5fb3" text-anchor="middle" font-weight="700" >「世界モデル」</text>
<text x="444" y="196" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >言葉の予測だけでは</text>
<text x="444" y="220" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >足りない。世界を</text>
<text x="444" y="244" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >予測するモデルを</text>
<rect x="536" y="20" width="160" height="290" rx="8" fill="#eef2fa" stroke="none" stroke-width="1" />
<text x="616" y="56" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700" >ベンジオほか</text>
<text x="616" y="108" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2025</text>
<text x="616" y="150" font-size="17" fill="#2f5fb3" text-anchor="middle" font-weight="700" >「科学者AI」</text>
<text x="616" y="196" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >目標を追う</text>
<text x="616" y="220" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >エージェントは危険。</text>
<text x="616" y="244" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >説明に徹するAIを</text>
<rect x="708" y="20" width="160" height="290" rx="8" fill="#f4f2ee" stroke="none" stroke-width="1" />
<text x="788" y="56" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700" >ヒントン</text>
<text x="788" y="108" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2025</text>
<text x="788" y="150" font-size="17" fill="#2f5fb3" text-anchor="middle" font-weight="700" >「母性本能」</text>
<text x="788" y="196" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >人より賢いAIは</text>
<text x="788" y="220" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >支配できない。人を</text>
<text x="788" y="244" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >気にかけ続ける仕組みを</text>
</svg>
