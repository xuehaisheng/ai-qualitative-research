<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="四つのメタファーのユニット数：似姿50、レンズ72、手23、秤68" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title>四つのメタファーのユニット数：似姿50、レンズ72、手23、秤68</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="820" height="300" fill="#ffffff"/>
<text x="134" y="52" font-size="18" fill="#1a1a1a" text-anchor="end" font-weight="700" >似姿</text>
<text x="134" y="72" font-size="13" fill="#666666" text-anchor="end" font-weight="400" >存在論</text>
<rect x="150" y="36" width="326.3888888888889" height="36" rx="4" fill="#2f5fb3" stroke="none" stroke-width="1" />
<text x="486.3888888888889" y="60" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="400" >50ユニット（22篇）</text>
<text x="134" y="114" font-size="18" fill="#1a1a1a" text-anchor="end" font-weight="700" >レンズ</text>
<text x="134" y="134" font-size="13" fill="#666666" text-anchor="end" font-weight="400" >認識論</text>
<rect x="150" y="98" width="470.0" height="36" rx="4" fill="#2f5fb3" stroke="none" stroke-width="1" />
<text x="630.0" y="122" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="400" >72ユニット（25篇）</text>
<text x="134" y="176" font-size="18" fill="#1a1a1a" text-anchor="end" font-weight="700" >手</text>
<text x="134" y="196" font-size="13" fill="#666666" text-anchor="end" font-weight="400" >方法論</text>
<rect x="150" y="160" width="150.13888888888889" height="36" rx="4" fill="#2f5fb3" stroke="none" stroke-width="1" />
