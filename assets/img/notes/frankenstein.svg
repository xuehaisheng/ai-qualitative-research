<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="ジョウジーらの比較：Copilotの引用の58%は捏造、人間の引用は79%が正確、Copilotの引用はデータの最初の2〜3ページに集中" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title>ジョウジーらの比較：Copilotの引用の58%は捏造、人間の引用は79%が正確、Copilotの引用はデータの最初の2〜3ページに集中</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="860" height="200" fill="#ffffff"/>
<rect x="20" y="20" width="260" height="160" rx="10" fill="#f4f2ee" stroke="none" stroke-width="1" />
<text x="44" y="86" font-size="44" fill="#b8612a" text-anchor="start" font-weight="700" >58%</text>
<text x="44" y="128" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="400" >Copilotが示した引用のうち、</text>
<text x="44" y="150" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="400" >データに存在しないものの割合（平均）</text>
<rect x="300" y="20" width="260" height="160" rx="10" fill="#f4f2ee" stroke="none" stroke-width="1" />
<text x="324" y="86" font-size="44" fill="#2f5fb3" text-anchor="start" font-weight="700" >79%</text>
<text x="324" y="128" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="400" >人間の研究者の引用が、</text>
<text x="324" y="150" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="400" >データどおり正確だった割合（平均）</text>
<rect x="580" y="20" width="260" height="160" rx="10" fill="#f4f2ee" stroke="none" stroke-width="1" />
<text x="604" y="86" font-size="44" fill="#1a1a1a" text-anchor="start" font-weight="700" >2〜3頁</text>
<text x="604" y="128" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="400" >Copilotのテーマと引用は、</text>
<text x="604" y="150" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="400" >データの最初の2〜3ページから</text>
</svg>
