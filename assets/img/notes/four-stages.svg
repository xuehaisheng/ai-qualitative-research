<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="質的研究者の生成AIへの反応：期待と比較、拒否、攻防、その先" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title>質的研究者の生成AIへの反応：期待と比較、拒否、攻防、その先</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="880" height="230" fill="#ffffff"/>
<path d="M20,40 L200,40 L220,95 L200,150 L20,150 L40,95 Z" fill="#e9eef8"/>
<text x="120" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2023〜2024</text>
<text x="120" y="80" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700" >① 期待と比較</text>
<text x="120" y="108" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >言葉が分かるなら、分析にも</text>
<text x="120" y="128" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >使えるはず。比較研究が急増</text>
<path d="M235,40 L415,40 L435,95 L415,150 L235,150 L255,95 Z" fill="#f8ece4"/>
<text x="335" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2025</text>
<text x="335" y="80" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700" >② 拒否</text>
<text x="335" y="108" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >9月 フランケンシュタイン論文</text>
<text x="335" y="128" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >12月 419名の拒否声明</text>
<path d="M450,40 L630,40 L650,95 L630,150 L450,150 L470,95 Z" fill="#f3e3d6"/>
<text x="550" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2026</text>
<text x="550" y="80" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700" >③ 攻防</text>
<text x="550" y="108" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >「拒否を拒否する」反論が</text>
<text x="550" y="128" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >相次ぐ。賛同する立場も</text>
<path d="M665,40 L845,40 L865,95 L845,150 L665,150 L685,95 Z" fill="#dfe6f4"/>
<text x="765" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2026〜</text>
<text x="765" y="80" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700" >④ その先</text>
<text x="765" y="108" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >比較はつづく。</text>
<text x="765" y="128" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >二分法を超える議論へ</text>
<text x="20" y="190" font-size="14" fill="#666666" text-anchor="start" font-weight="400" >段階ははっきり入れ替わるのではなく、重なっている。たとえば比較研究は、拒否声明のあとも続いている。</text>
</svg>
