<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="RNNは一語ずつ順番に読み、Attentionは全部の語を一度に見て重みをつける" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title>RNNは一語ずつ順番に読み、Attentionは全部の語を一度に見て重みをつける</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="860" height="470" fill="#ffffff"/>
<text x="30" y="40" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700" >RNN：一語ずつ、順番に読む</text>
<rect x="30" y="62" width="74" height="40" rx="6" fill="#f4f2ee" stroke="#d9d9d9" stroke-width="1" />
<text x="67.0" y="88" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >今日、</text>
<rect x="130" y="62" width="42" height="40" rx="6" fill="#f4f2ee" stroke="#d9d9d9" stroke-width="1" />
<text x="151.0" y="88" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >本</text>
<rect x="198" y="62" width="138" height="40" rx="6" fill="#f4f2ee" stroke="#d9d9d9" stroke-width="1" />
<text x="267.0" y="88" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >を一冊買った。</text>
<rect x="362" y="62" width="106" height="40" rx="6" fill="#f4f2ee" stroke="#d9d9d9" stroke-width="1" />
<text x="415.0" y="88" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >…図書館…</text>
<rect x="494" y="62" width="106" height="40" rx="6" fill="#f4f2ee" stroke="#d9d9d9" stroke-width="1" />
<text x="547.0" y="88" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >…カフェ…</text>
<rect x="626" y="62" width="106" height="40" rx="6" fill="#f4f2ee" stroke="#d9d9d9" stroke-width="1" />
<text x="679.0" y="88" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >読み始めた</text>
<rect x="758" y="62" width="58" height="40" rx="6" fill="#f4f2ee" stroke="#d9d9d9" stroke-width="1" />
<text x="787.0" y="88" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="400" >それ</text>
<line x1="107" y1="82" x2="126" y2="82" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="175" y1="82" x2="194" y2="82" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="339" y1="82" x2="358" y2="82" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="471" y1="82" x2="490" y2="82" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="603" y1="82" x2="622" y2="82" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="735" y1="82" x2="754" y2="82" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="30" y="136" font-size="15" fill="#666666" text-anchor="start" font-weight="400" >前の語を読み終えるまで次へ進めない。文が長いと「それ」が「本」を指すことを見失いやすい。</text>
<line x1="30" y1="165" x2="830" y2="165" stroke="#d9d9d9" stroke-width="1" stroke-linecap="round" />
<text x="30" y="202" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700" >Attention：全部の語を一度に見て、大事な語に重みをつける</text>
<rect x="380" y="398" width="100" height="44" rx="8" fill="#2f5fb3" stroke="none" stroke-width="1" />
<text x="430" y="426" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" >それ</text>
<text x="492" y="426" font-size="14" fill="#666666" text-anchor="start" font-weight="400" >← いま処理している語</text>
<line x1="430" y1="398" x2="110" y2="284" stroke="#666666" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
<rect x="62" y="240" width="96" height="44" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1" />
<text x="110" y="268" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="400" >今日</text>
<text x="110" y="230" font-size="15" fill="#666666" text-anchor="middle" font-weight="400" >0.03</text>
<line x1="430" y1="398" x2="270" y2="284" stroke="#b8612a" stroke-width="12.2" stroke-linecap="round" opacity="0.85"/>
<rect x="222" y="240" width="96" height="44" rx="6" fill="#ffffff" stroke="#b8612a" stroke-width="2" />
<text x="270" y="268" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700" >本</text>
<text x="270" y="230" font-size="15" fill="#b8612a" text-anchor="middle" font-weight="700" >0.70</text>
<line x1="430" y1="398" x2="430" y2="284" stroke="#666666" stroke-width="2.3" stroke-linecap="round" opacity="0.85"/>
<rect x="382" y="240" width="96" height="44" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1" />
<text x="430" y="268" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="400" >図書館</text>
<text x="430" y="230" font-size="15" fill="#666666" text-anchor="middle" font-weight="400" >0.08</text>
<line x1="430" y1="398" x2="590" y2="284" stroke="#666666" stroke-width="2.0" stroke-linecap="round" opacity="0.85"/>
<rect x="542" y="240" width="96" height="44" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1" />
<text x="590" y="268" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="400" >カフェ</text>
<text x="590" y="230" font-size="15" fill="#666666" text-anchor="middle" font-weight="400" >0.06</text>
<line x1="430" y1="398" x2="750" y2="284" stroke="#666666" stroke-width="3.1" stroke-linecap="round" opacity="0.85"/>
<rect x="702" y="240" width="96" height="44" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1" />
<text x="750" y="268" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="400" >読み</text>
<text x="750" y="230" font-size="15" fill="#666666" text-anchor="middle" font-weight="400" >0.13</text>
<text x="30" y="462" font-size="14" fill="#666666" text-anchor="start" font-weight="400" >線の太さと数字は重みの大きさ（説明のための例）。順番に読まなくてよいので、計算を同時に進められる。</text>
</svg>
