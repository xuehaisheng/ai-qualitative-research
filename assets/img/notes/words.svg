<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" role="img" aria-label="AIの使い方を表す言葉の変化：プロンプト、コンテキスト、スキル、ハーネス" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title>AIの使い方を表す言葉の変化：プロンプト、コンテキスト、スキル、ハーネス</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="860" height="210" fill="#ffffff"/>
<rect x="20" y="40" width="180" height="110" rx="8" fill="#e9eef8" stroke="none" stroke-width="1" />
<text x="110" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2022年末</text>
<text x="110" y="88" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700" >プロンプト</text>
<text x="110" y="120" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" >どう聞くか</text>
<line x1="204" y1="95" x2="226" y2="95" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="230" y="40" width="180" height="110" rx="8" fill="#d6e0f2" stroke="none" stroke-width="1" />
<text x="320" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2025.6</text>
<text x="320" y="88" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700" >コンテキスト</text>
<text x="320" y="120" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" >何を見せるか</text>
<line x1="414" y1="95" x2="436" y2="95" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="440" y="40" width="180" height="110" rx="8" fill="#bfcfeb" stroke="none" stroke-width="1" />
<text x="530" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2025.10</text>
<text x="530" y="88" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700" >スキル</text>
<text x="530" y="120" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" >手順書にまとめる</text>
<line x1="624" y1="95" x2="646" y2="95" stroke="#666666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="650" y="40" width="180" height="110" rx="8" fill="#a6bce3" stroke="none" stroke-width="1" />
<text x="740" y="30" font-size="14" fill="#666666" text-anchor="middle" font-weight="400" >2026.2</text>
<text x="740" y="88" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700" >ハーネス</text>
<text x="740" y="120" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" >働く環境ごと設計する</text>
<text x="20" y="192" font-size="15" fill="#666666" text-anchor="start" font-weight="400" >「どう聞くか」から「どんな環境を作るか」へ。言葉の変化は、人とAIの協働のしかたの変化でもある。</text>
</svg>
